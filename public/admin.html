<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration — Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* Couleurs des séries validées (scripts/validate_palette.js, mode sombre, fond #151513) */
  :root { --s-clients: #b58a2a; --s-packs: #7d7bd4; --r: 12px; }
  main { padding: 26px 0 80px; }
  .panel { background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
  .kick { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
  .muted { color: var(--text-lo); }
  h2.t { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .topbar h1 { font-size: 26px; }
  .tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--text-lo); cursor: pointer; }
  .tabs button:hover { color: var(--text-hi); }
  .tabs button.on { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
  .tabs .badge { display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 6px; border-radius: 9px; background: var(--err); color: #1b0d08; font-size: 10px; font-weight: 700; }

  .periods { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .periods button { background: none; border: none; padding: 9px 13px; font-family: var(--mono); font-size: 12px; color: var(--text-lo); cursor: pointer; border-left: 1px solid var(--line-2); }
  .periods button:first-child { border-left: none; }
  .periods button.on { background: var(--gold); color: #241a05; font-weight: 700; }

  /* À faire */
  .todo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .todo .panel { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px; cursor: pointer; text-align: left; color: inherit; }
  .todo .panel:hover { border-color: var(--line-2); }
  .todo .v { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 4px; }
  .todo .go { font-family: var(--mono); font-size: 12px; color: var(--gold); white-space: nowrap; }
  .todo .warn { border-color: rgba(224,115,90,.45); }

  /* Chiffres clés */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi .v { font-family: var(--mono); font-size: 26px; font-weight: 700; margin: 8px 0 6px; letter-spacing: -0.01em; }
  .kpi .s { font-size: 12px; color: var(--text-lo); }
  .kpi.hero { grid-column: span 2; background: radial-gradient(ellipse 70% 90% at 0% 0%, rgba(212,175,90,.14), transparent 60%), var(--ink-2); border-color: rgba(212,175,90,.28); }
  .kpi.hero .v { font-size: 38px; color: var(--gold); }
  .ev { font-family: var(--mono); font-size: 11.5px; margin-left: 6px; white-space: nowrap; }
  .ev.up { color: var(--ok); } .ev.down { color: var(--err); } .ev.flat { color: var(--text-dim); }
  .split { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-lo); margin-top: 6px; }
  .split b { color: var(--text-hi); font-family: var(--mono); font-weight: 500; }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  .grid2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }

  /* Graphiques */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-lo); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart { width: 100%; height: auto; display: block; margin-top: 10px; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--text-dim); }
  .chart .grid { stroke: rgba(245,243,238,0.06); }
  .chart .base { stroke: rgba(245,243,238,0.18); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover { fill: rgba(245,243,238,0.04); }
  .tip { position: fixed; z-index: 90; pointer-events: none; background: #0b0b0a; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; min-width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
  .tip b { display: block; font-family: var(--mono); font-size: 11px; color: var(--text-lo); margin-bottom: 6px; font-weight: 500; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip div span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-lo); }
  .tip div span:last-child { font-family: var(--mono); color: var(--text-hi); }
  .tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  details.tbl { margin-top: 10px; }
  details.tbl summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }

  .hbars { display: grid; gap: 16px; }
  .hb .top2 { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; margin-bottom: 7px; }
  .hb .top2 span:last-child { font-family: var(--mono); color: var(--text-lo); font-size: 12.5px; }
  .hb .track { display: flex; gap: 2px; height: 10px; }
  .hb .track i { display: block; height: 100%; }
  .hb .track i:first-child { border-radius: 4px 0 0 4px; }
  .hb .track i:last-child { border-radius: 0 4px 4px 0; }
  .hb .track i:only-child { border-radius: 4px; }
  .hb small { display: block; font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 5px; }

  .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pk { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--ink); }
  .pk .n { font-family: var(--mono); font-size: 26px; font-weight: 700; margin: 6px 0 2px; }
  .pk .s { font-size: 12px; color: var(--text-lo); }
  .compo { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .compo .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 10px 0 12px; background: rgba(245,243,238,0.06); }
  .compo .leg { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--text-lo); }
  .compo .leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .compo .leg b { color: var(--text-hi); font-weight: 600; }

  table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.list th, table.list td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; background: none; white-space: nowrap; }
  table.list th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); }
  table.list tr:last-child td { border-bottom: none; }
  table.list .r { text-align: right; font-family: var(--mono); }
  table.list th[data-k] { cursor: pointer; }
  .scroll { overflow-x: auto; }
  .rank { font-family: var(--mono); color: var(--text-dim); width: 26px; }

  table.list td.multi { white-space: normal; min-width: 150px; }
  .cfgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .cfgsec h2 { font-size: 16px; margin-bottom: 4px; }
  .cfgsec > p { font-size: 12.5px; color: var(--text-lo); margin-bottom: 14px; }
  .cf { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .cf > span { font-size: 13.5px; }
  .cf small { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .unit { display: flex; align-items: center; gap: 6px; }
  .unit .input { text-align: right; padding: 8px 10px; }
  .unit em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--text-lo); min-width: 28px; }
  .cf.check { grid-template-columns: auto minmax(0, 1fr); cursor: pointer; }
  .cf.check input { width: 18px; height: 18px; accent-color: var(--gold); }
  .rows { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rows th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); text-align: left; padding: 6px 6px 6px 0; }
  .rows td { padding: 5px 6px 5px 0; }
  .rows .input { padding: 8px 10px; }
  .rows textarea.input { width: 100%; resize: vertical; font: inherit; }
  @media (max-width: 700px) {
    table[data-k="AVIS"], table[data-k="AVIS"] tbody { display: block; }
    table[data-k="AVIS"] thead { display: none; }
    table[data-k="AVIS"] tr { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
    table[data-k="AVIS"] td { padding: 0; min-width: 0 !important; }
    table[data-k="AVIS"] td:nth-child(3), table[data-k="AVIS"] td:nth-child(4) { grid-column: span 1; }
    table[data-k="AVIS"] td:nth-child(5) { grid-column: 1 / -1; order: 5; }
    table[data-k="AVIS"] td:nth-child(6) { grid-row: 1; grid-column: 3; }
    table[data-k="AVIS"] .input { width: 100%; }
  }
  .cfgsec .save { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .cfg { display: grid; grid-template-columns: 240px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cfg code { font-family: var(--mono); font-size: 12px; color: var(--gold); }
  .cfg textarea { font-family: var(--mono); font-size: 12px; min-height: 38px; resize: vertical; }
  td .btn { margin-right: 4px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools .input { width: auto; flex: 1; max-width: 320px; }
  .cmd-tools { justify-content: space-between; align-items: center; }
  .filtres { display: flex; flex-wrap: wrap; gap: 6px; }
  .filtres button { background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 12px; font-family: var(--mono); font-size: 12px; color: var(--text-lo); cursor: pointer; }
  .filtres button span { color: var(--text-dim); margin-left: 4px; }
  .filtres button.on { background: var(--gold); border-color: var(--gold); color: #241a05; font-weight: 700; }
  .filtres button.on span { color: #241a05; }

  @media (max-width: 1000px) {
    .todo, .kpis { grid-template-columns: 1fr 1fr; }
    .grid2, .grid2b { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .cmd-tools .input { max-width: none; flex-basis: 100%; }
    /* Tableaux en fiches : l'en-tête de colonne devient l'étiquette de chaque valeur */
    table.list thead { display: none; }
    table.list, table.list tbody { display: block; }
    table.list tr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    table.list tr:last-child { border-bottom: none; }
    table.list td { display: block; padding: 0; border: none; white-space: normal; text-align: left; min-width: 0; overflow-wrap: anywhere; }
    table.list td.r { text-align: left; }
    table.list td[data-label]::before { content: attr(data-label); display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
    table.list td.main, table.list td.acts, table.list td[colspan] { grid-column: 1 / -1; }
    table.list td.main { font-size: 14.5px; }
    table.list td.main { order: -1; }
    table.list.c3 tr { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    table.list td.main::before, table.list td.acts::before { display: none; }
    table.list td.acts { display: flex; gap: 8px; flex-wrap: wrap; }
    table.list td.acts:empty { display: none; }
    table.list td.rank { display: none; }
    .scroll { overflow-x: visible; }
    .kpi.hero { grid-column: span 2; }
    .kpi .v { font-size: 21px; } .kpi.hero .v { font-size: 30px; }
    .todo { grid-template-columns: 1fr; }
    .packs { grid-template-columns: 1fr; }
    .cfg { grid-template-columns: 1fr; }
    .cfgs { grid-template-columns: minmax(0, 1fr); }
    .periods button { padding: 9px 9px; }
  }
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><a class="logo" href="/">BIOCEZ · ADMIN</a><nav><a href="/" class="hide-m">Voir le site</a><a href="#" id="logout" hidden>Déconnexion</a></nav></div></header>
<main><div class="wrap">
  <form class="panel" id="login" style="max-width:420px;margin:40px auto" hidden>
    <h1 style="font-size:22px;margin-bottom:18px">Administration</h1>
    <div class="field"><label for="tok">Jeton administrateur (ADMIN_TOKEN)</label><input class="input mono" id="tok" type="password" required autocomplete="current-password"></div>
    <p class="form-error" id="login-err"></p>
    <button class="btn gold block">ENTRER</button>
  </form>
  <div id="panel" hidden>
    <div class="topbar"><h1>Administration</h1><button class="btn sm" id="cycle">ACTUALISER LES COMMISSIONS</button></div>
    <nav class="tabs" id="tabs">
      <button data-t="dashboard" class="on">Tableau de bord</button>
      <button data-t="commandes">Commandes</button>
      <button data-t="revendeurs">Revendeurs</button>
      <button data-t="versements">Versements</button>
      <button data-t="signalements">Signalements</button>
      <button data-t="emails">E-mails</button>
      <button data-t="config">Configuration</button>
    </nav>
    <div id="view"></div>
  </div>
</div></main>
<div class="tip" id="tip" role="tooltip"></div>

<script type="module">
import { eur, eur0, pct, fdate, esc, toast } from '/assets/app.js';
let TOKEN = sessionStorage.getItem('bz_admin') || '';
async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, { method, headers: { 'x-admin-token': TOKEN, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { sessionStorage.removeItem('bz_admin'); show(false); document.getElementById('login-err').textContent = 'Jeton incorrect.'; }
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
const act = async (fn, ok) => { try { await fn(); toast(ok); render(); } catch (e) { toast(e.message, true); } };
function show(on) { document.getElementById('login').hidden = on; document.getElementById('panel').hidden = !on; document.getElementById('logout').hidden = !on; }
document.getElementById('login').addEventListener('submit', e => { e.preventDefault(); document.getElementById('login-err').textContent = ''; TOKEN = e.target.tok.value; sessionStorage.setItem('bz_admin', TOKEN); show(true); aller(tab); });
document.getElementById('logout').addEventListener('click', e => { e.preventDefault(); sessionStorage.removeItem('bz_admin'); TOKEN = ''; show(false); });

const TABS = ['dashboard', 'commandes', 'revendeurs', 'versements', 'signalements', 'emails', 'config'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard';
// Sur téléphone, la barre d'onglets défile : on centre l'onglet ouvert pour qu'il reste visible.
function centrerOnglet() {
  const nav = document.getElementById('tabs'), b = nav.querySelector('button.on');
  if (b) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
}
function aller(t) { tab = t; history.replaceState(null, '', '#' + t); document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === t)); centrerOnglet(); render().catch(() => {}); }
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) aller(b.dataset.t); });
document.getElementById('cycle').addEventListener('click', () => act(async () => { const r = await api('/api/admin/cycle', { method: 'POST' }); toast(`${r.validees} commission(s) validée(s), ${r.beneficiaires_payables} revendeur(s) à payer`); }, 'Commissions actualisées'));
const view = document.getElementById('view');
const STATUT = { en_attente_paiement: ['En attente', 'off'], payee: ['Payée · à livrer', 'info'], livree: ['Livrée', 'ok'], remboursee: ['Remboursée', 'err'], abandonnee: ['Abandonnée', 'off'] };
const statut = s => `<span class="pill ${STATUT[s]?.[1] ?? 'off'}">${STATUT[s]?.[0] ?? s}</span>`;

// ---------- Infobulle des graphiques
const tip = document.getElementById('tip');
view.addEventListener('mousemove', e => {
  const h = e.target.closest('[data-tip]');
  if (!h) { tip.style.display = 'none'; return; }
  tip.innerHTML = h.dataset.tip; tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
view.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ---------- Tableau de bord
let jours = Number(sessionStorage.getItem('bz_admin_jours') ?? 30);
const PERIODES = [[7, '7 j'], [30, '30 j'], [90, '3 mois'], [365, '12 mois'], [0, 'Tout']];
const evo = (v, inverse = false) => {
  if (v == null || !isFinite(v)) return '';
  if (Math.abs(v) < 0.005) return '<span class="ev flat">= stable</span>';
  const up = v > 0, bien = inverse ? !up : up;
  return `<span class="ev ${bien ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(v * 100).toLocaleString('fr-FR', { maximumFractionDigits: 0 })} %</span>`;
};
const nomPeriode = () => PERIODES.find(p => p[0] === jours)?.[1] ?? '';

function barresEmpilees(serie, pas) {
  const W = 760, H = 250, pl = 54, pr = 22, pb = 24, pt = 10, n = serie.length;
  const tot = serie.map(p => p.clients + p.packs), max = Math.max(...tot, 100);
  const step = 10 ** Math.floor(Math.log10(max)), top = Math.ceil(max / step) * step;
  const y = v => pt + (H - pb - pt) * (1 - v / top), bw = (W - pl - pr) / n, w = Math.max(3, Math.min(bw * 0.62, 34));
  const lab = k => pas === 'mois' ? new Date(k + '-01T12:00:00Z').toLocaleDateString('fr-FR', { month: 'short', timeZone: 'UTC' }).replace('.', '')
    : new Date(k + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' }).replace('.', '');
  const titre = k => pas === 'mois' ? new Date(k + '-01T12:00:00Z').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' })
    : (pas === 'semaine' ? 'Semaine du ' : '') + new Date(k + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: pas === 'jour' ? 'long' : undefined, day: 'numeric', month: 'long', timeZone: 'UTC' });
  const chaque = Math.ceil(n / 12);
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4; s += `<line class="${i ? 'grid' : 'base'}" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 3}" text-anchor="end">${v >= 1e5 ? (v / 1e5).toLocaleString('fr-FR') + ' k€' : eur0(v)}</text>`; }
  serie.forEach((p, i) => {
    const cx = pl + i * bw + bw / 2, x = cx - w / 2;
    const hC = y(0) - y(p.clients), hP = y(0) - y(p.packs), gap = p.clients && p.packs ? 2 : 0;
    if (p.clients) s += `<path d="${barre(x, y(0) - hC, w, hC, !p.packs)}" fill="var(--s-clients)"/>`;
    if (p.packs) s += `<path d="${barre(x, y(0) - hC - hP, w, hP - gap, true)}" fill="var(--s-packs)"/>`;
    if (i % chaque === 0) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${lab(p.k)}</text>`;
    const t = `<b>${esc(titre(p.k))}</b><div><span><i style="background:var(--s-clients)"></i>Ventes clients</span><span>${eur(p.clients)}</span></div>
      <div><span><i style="background:var(--s-packs)"></i>Packs</span><span>${eur(p.packs)}</span></div><div><span>Total</span><span>${eur(p.clients + p.packs)}</span></div>`;
    s += `<rect class="hit" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pb - pt}" data-tip="${esc(t)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires par période">${s}</svg>`;
}
// Barre verticale arrondie (4 px) uniquement en haut, ancrée à la ligne de base.
function barre(x, yTop, w, h, arrondi) {
  if (h <= 0) return '';
  const r = arrondi ? Math.min(4, h, w / 2) : 0, b = yTop + h;
  return `M${x},${b} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${b} Z`;
}

async function dashboard() {
  const S = await api('/api/admin/stats?jours=' + jours);
  const K = S.kpis, E = S.evolution, AF = S.a_faire;
  const pr = jours ? `vs ${nomPeriode()} précédents` : 'depuis le lancement';

// ---------- Revendeurs
let revTri = 'ventes_ttc', revSens = -1, revCache = null;
async function revendeurs() {
  revCache ??= await api('/api/admin/revendeurs');
  const q = (view.querySelector('#rq')?.value ?? '').trim().toLowerCase(), f = view.querySelector('#rf')?.value ?? '';
  const rows = revCache.filter(r => !q || `${r.prenom} ${r.nom} ${r.email} ${r.ville ?? ''} ${r.code_parrainage}`.toLowerCase().includes(q))
    .filter(r => !f || (f === 'pack' ? r.statut === 'pack' : f === 'sans' ? r.statut !== 'pack' : r.rang === f))
    .sort((a, b) => { const x = a[revTri] ?? '', y = b[revTri] ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * revSens; });
  const cols = [['nom', 'Revendeur'], ['rang', 'Rang'], ['date_inscription', 'Inscription'], ['parrain', 'Parrain'], ['filleuls', 'Filleuls', 1], ['clients', 'Clients', 1], ['ventes_ttc', 'Ventes TTC', 1], ['gains', 'Gains', 1], ['derniere_vente', 'Dernière vente']];
  const garder = { q: view.querySelector('#rq')?.value ?? '', f };
  view.innerHTML = `<div class="tools"><input class="input" id="rq" type="search" placeholder="Nom, e-mail, ville, code…" value="${esc(garder.q)}">
    <select class="input" id="rf" style="max-width:200px"><option value="">Tous (${revCache.length})</option><option value="pack">Avec pack</option><option value="sans">Sans pack</option>
    ${[...new Set(revCache.map(r => r.rang))].map(r => `<option value="${esc(r)}">Rang ${esc(r)}</option>`).join('')}</select></div>
    <div class="panel" style="padding:6px 14px"><div class="scroll"><table class="list"><thead><tr>${cols.map(([k, t, r]) => `<th data-k="${k}" class="${r ? 'r' : ''}${k === 'nom' ? ' main' : ''}">${t}${k === revTri ? (revSens > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.prenom)} ${esc(r.nom)}</b><div class="muted" style="font-size:11.5px">${esc(r.email)} · <span class="mono">${esc(r.code_parrainage)}</span></div></td>
      <td>${esc(r.rang)}${r.statut === 'pack' ? ' <span class="pill gold">pack</span>' : ''}${r.classement_visible ? '' : ' <span class="pill" title="Masqué du classement national">masqué</span>'}</td><td class="mono">${fdate(r.date_inscription)}</td><td>${esc(r.parrain ?? '—')}</td>
      <td class="r">${r.filleuls}</td><td class="r">${r.clients}</td><td class="r">${eur0(r.ventes_ttc)}</td><td class="r">${eur0(r.gains)}</td><td class="mono">${fdate(r.derniere_vente)}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">Aucun revendeur.</td></tr>'}
    </tbody></table></div></div>`;
  view.querySelector('#rf').value = garder.f;
  enFiches();
}
view.addEventListener('input', e => { if (e.target.id === 'rq') { const pos = e.target.selectionStart; revendeurs().then(() => { const i = view.querySelector('#rq'); i.focus(); i.setSelectionRange(pos, pos); }); } });
view.addEventListener('change', e => { if (e.target.id === 'rf') revendeurs(); });

// Prépare chaque tableau pour l'affichage en fiches sur téléphone (étiquettes, cellule principale, actions).
function enFiches() {
  view.querySelectorAll('table.list').forEach(t => {
    const ths = [...t.querySelectorAll('thead th')];
    let main = ths.findIndex(th => th.classList.contains('main'));
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
      if (td.hasAttribute('colspan')) return;
      if (td.querySelector('button, a.btn') || (i === ths.length - 1 && !ths[i]?.textContent.trim())) { td.classList.add('acts'); return; }
      if (i === main) { td.classList.add('main'); return; }
      const l = ths[i]?.textContent.replace(/[↑↓]/g, '').trim();
      if (l) td.dataset.label = l;
    }));
  });
}

// ---------- Commandes : filtre (« À livrer » par défaut), recherche, pages de 50
const FILTRES_CMD = [['payee', 'À livrer'], ['livree', 'Livrées'], ['remboursee', 'Remboursées'], ['en_attente_paiement', 'Non payées'], ['', 'Toutes']];
let cmdFiltre = sessionStorage.getItem('bz_admin_cmd') ?? 'payee', cmdQ = '', cmdDernier = null, cmdRecherche = null;
const PAGE_CMD = 50;
const ligneCommande = o => `<tr><td class="mono">${o.id}</td><td class="mono">${fdate(o.created_at)}</td><td>${o.type === 'pack' ? `Pack ${o.pack_taille}` : 'Vente'}</td>
  <td>${esc(o.acheteur ?? o.client_email)}</td><td class="mono">${esc(o.ref_code ?? '—')}${o.attribution_bloquee ? ' <span class="pill err">bloquée</span>' : ''}</td>
  <td>${statut(o.statut)}</td><td class="r">${eur(o.montant_ttc_cents)}${o.frais_livraison_cents ? `<small class="muted" style="display:block;font-size:10.5px">+ ${eur(o.frais_livraison_cents)} livraison</small>` : ''}</td><td class="r">${eur(o.montant_ht_cents)}</td>
  <td>${o.statut === 'payee' ? `<button class="btn sm" data-a="livrer" data-id="${o.id}">LIVRÉE</button>` : ''}
      ${['payee', 'livree'].includes(o.statut) ? `<button class="btn sm" data-a="rembourser" data-id="${o.id}">REMBOURSER</button>` : ''}</td></tr>`;
async function chargerCommandes(reset) {
  const tb = document.getElementById('cmd-rows'); if (!tb) return;
  if (reset) cmdDernier = null;
  const qs = new URLSearchParams({ limite: String(PAGE_CMD + 1) });
  if (cmdFiltre) qs.set('statut', cmdFiltre);
  if (cmdQ) qs.set('q', cmdQ);
  if (cmdDernier) qs.set('avant', String(cmdDernier));
  const rows = await api('/api/admin/commandes?' + qs);
  const page = rows.slice(0, PAGE_CMD);
  const html = page.map(ligneCommande).join('');
  if (reset) tb.innerHTML = html || `<tr><td colspan="9" class="muted">${cmdQ ? 'Aucune commande ne correspond à cette recherche.' : cmdFiltre === 'payee' ? 'Rien à livrer pour le moment.' : 'Aucune commande.'}</td></tr>`;
  else tb.insertAdjacentHTML('beforeend', html);
  cmdDernier = page.at(-1)?.id ?? cmdDernier;
  document.getElementById('cmd-plus').hidden = rows.length <= PAGE_CMD;
  enFiches();
}
view.addEventListener('input', e => {
  if (e.target.id !== 'cmd-q') return;
  clearTimeout(cmdRecherche);
  cmdRecherche = setTimeout(() => { cmdQ = e.target.value.trim(); chargerCommandes(true).catch(x => toast(x.message, true)); }, 250);
});
view.addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (f && tab === 'commandes') { cmdFiltre = f.dataset.f; sessionStorage.setItem('bz_admin_cmd', cmdFiltre); render(); return; }
  if (e.target.closest('#cmd-plus')) chargerCommandes(false).catch(x => toast(x.message, true));
});

async function render() {
  await rendu();
  enFiches();
}

      `<div class="panel" style="padding:6px 14px"><div class="scroll"><table class="list"><thead><tr><th>Date</th><th>Modèle</th><th>Destinataire</th><th class="main">Objet</th><th>Statut</th></tr></thead><tbody>
      ${emails.map(m => `<tr><td class="mono">${fdate(m.created_at)}</td><td class="mono">${esc(m.modele)}</td><td>${esc(m.destinataire)}</td><td>${esc(m.sujet)}</td>
        <td><span class="pill ${ST[m.statut][1]}" title="${esc(m.erreur ?? '')}">${ST[m.statut][0]}</span></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Aucun e-mail.</td></tr>'}
      </tbody></table></div></div>`;
  } else {
    cfgActuelle = await api('/api/admin/config');
    view.innerHTML = `<p class="notice" style="margin-bottom:16px">Les taux s'appliquent aux <b>nouvelles</b> ventes : chaque commission garde le taux enregistré au moment de la vente.</p>
      <div class="cfgs">${CFG_SECTIONS.map(sec => sectionConfig(sec, cfgActuelle)).join('')}</div>` +
      (autresCles(cfgActuelle).length ? `<h2 class="t" style="margin-top:26px">Réglages avancés</h2>` + autresCles(cfgActuelle).map(k => `<div class="cfg"><code>${k}</code><textarea class="input" data-k="${k}" rows="1">${esc(JSON.stringify(cfgActuelle[k]))}</textarea>
        <button class="btn sm" data-a="config" data-id="${k}">ENREGISTRER</button></div>`).join('') : '');
  }
}
// ---------- Configuration en clair
let cfgActuelle = {};
const NIVEAUX_V = ['Le vendeur', 'Son parrain', 'Le parrain du parrain'];
const NIVEAUX_P = ['Parrain direct', 'Parrain suivant', '3e parrain'];
const CFG_SECTIONS = [
  { titre: 'Commissions sur les ventes clients', aide: 'Pourcentage du montant HT de chaque commande passée par un lien.',
    champs: [{ k: 'TAUX_VENTE_CLIENT', t: 'pct3', labels: NIVEAUX_V }] },
  { titre: 'Commissions sur les packs', aide: 'Versées aux parrains quand un filleul achète un pack. L\'acheteur ne touche rien.',
    champs: [{ k: 'PACK_COMMISSION_ENABLED', t: 'bool', label: 'Verser une commission sur les packs des filleuls' },
             { k: 'PACK_COMMISSION_FIRST_ONLY', t: 'bool', label: 'Seulement sur le premier pack de chaque filleul' },
             { k: 'TAUX_PACK', t: 'pct3', labels: NIVEAUX_P }] },
  { titre: 'Packs de démarrage', aide: 'Nombre de pots et remise sur le prix public.', champs: [{ k: 'PACKS', t: 'packs' }] },
  { titre: 'Versements', aide: 'Quand les commissions deviennent payables.',
    champs: [{ k: 'PAYOUT_MIN', t: 'nombre', label: 'Versement minimum', unite: '€', min: 0 },
             { k: 'RETRACTATION_JOURS', t: 'nombre', label: 'Délai avant validation', aide: 'Jours après la livraison (droit de rétractation)', unite: 'jours', min: 0, max: 60, entier: true },
             { k: 'DEDUIRE_FRAIS_STRIPE', t: 'bool', label: 'Déduire les frais Stripe avant de calculer les commissions' }] },
  { titre: 'Livraison', aide: 'Ventes clients. Les packs sont toujours livrés gratuitement. Les frais de port ne comptent pas dans les commissions.',
    champs: [{ k: 'LIVRAISON_OFFERTE_DES', t: 'nombre', label: 'Livraison offerte dès', aide: 'Montant du panier TTC', unite: '€', min: 0 },
             { k: 'FRAIS_LIVRAISON', t: 'nombre', label: 'Frais de livraison sinon', unite: '€', min: 0, max: 100 }] },
  { titre: 'Clients et parrainage', aide: 'Comment une vente est attribuée à un revendeur.',
    champs: [{ k: 'REF_COOKIE_JOURS', t: 'nombre', label: 'Durée du lien de parrainage', aide: 'Après un clic sur un lien', unite: 'jours', min: 1, max: 365, entier: true },
             { k: 'CLIENT_RATTACHE_DEFINITIF', t: 'bool', label: 'Un client reste rattaché pour toujours au revendeur de son premier achat' },
             { k: 'ACTIF_JOURS', t: 'nombre', label: 'Revendeur « actif »', aide: 'S\'il a vendu dans les derniers', unite: 'jours', min: 1, max: 365, entier: true },
             { k: 'CLASSEMENT_ACTIF', t: 'bool', label: 'Afficher le classement national dans les espaces revendeurs' }] },
  { titre: 'TVA', aide: 'Taux appliqué aux compléments alimentaires (à confirmer avec l\'expert-comptable).',
    champs: [{ k: 'VAT_RATE', t: 'pct', label: 'Taux de TVA' }] },
  { titre: 'Rangs', aide: 'Un rang est atteint quand les ventes TTC ET le nombre de filleuls atteignent les seuils.', large: true,
    champs: [{ k: 'RANGS', t: 'rangs' }] },
  { titre: 'Avis clients (page d\'accueil)', aide: 'Uniquement de vrais avis, publiés avec l\'accord du client : un faux avis est interdit et sanctionné. Le bloc n\'apparaît sur l\'accueil qu\'à partir de 3 avis.', large: true,
    champs: [{ k: 'AVIS', t: 'avis' }] },
];
const autresCles = cfg => Object.keys(cfg).filter(k => !CFG_SECTIONS.some(s => s.champs.some(c => c.k === k)));
const pctVal = x => Number((x * 100).toFixed(2));
const unite = (attrs, u) => `<span class="unit"><input class="input" type="number" inputmode="decimal" ${attrs}><em>${u}</em></span>`;
function champConfig(c, v) {
  if (c.t === 'bool') return `<label class="cf check"><input type="checkbox" data-k="${c.k}" ${v ? 'checked' : ''}><span>${c.label}</span></label>`;
  if (c.t === 'pct') return `<label class="cf"><span>${c.label}</span>${unite(`data-k="${c.k}" step="0.1" min="0" max="99.9" value="${pctVal(v)}" required`, '%')}</label>`;
  if (c.t === 'nombre') return `<label class="cf"><span>${c.label}${c.aide ? `<small>${c.aide}</small>` : ''}</span>${unite(`data-k="${c.k}" step="${c.entier ? 1 : 'any'}" min="${c.min}" ${c.max != null ? `max="${c.max}"` : ''} value="${v}" required`, c.unite)}</label>`;
  if (c.t === 'pct3') return c.labels.map((l, i) => `<label class="cf"><span>${l}</span>${unite(`data-k="${c.k}" data-i="${i}" step="0.1" min="0" max="99.9" value="${pctVal(v[i] ?? 0)}" required`, '%')}</label>`).join('');
  if (c.t === 'packs') return `<table class="rows" data-k="PACKS"><thead><tr><th>Pots</th><th>Remise</th><th></th></tr></thead><tbody>
    ${v.map(p => lignePack(p)).join('')}</tbody></table><button type="button" class="btn sm" data-a="ligne" data-t="pack" style="margin-top:8px">+ AJOUTER UN PACK</button>`;
  if (c.t === 'rangs') return `<table class="rows" data-k="RANGS"><thead><tr><th>Nom</th><th>Ventes TTC dès</th><th>Filleuls dès</th><th></th></tr></thead><tbody>
    ${v.map(r => ligneRang(r)).join('')}</tbody></table><button type="button" class="btn sm" data-a="ligne" data-t="rang" style="margin-top:8px">+ AJOUTER UN RANG</button>`;
  if (c.t === 'avis') return `<table class="rows" data-k="AVIS" data-vide="1"><thead><tr><th>Prénom</th><th>Ville</th><th>Note</th><th>Produit</th><th>Avis</th><th></th></tr></thead><tbody>
    ${v.map(a => ligneAvis(a)).join('')}</tbody></table><button type="button" class="btn sm" data-a="ligne" data-t="avis" style="margin-top:8px">+ AJOUTER UN AVIS</button>`;
}
const suppr = '<td><button type="button" class="btn sm" data-a="suppr" aria-label="Supprimer la ligne">✕</button></td>';
const lignePack = p => `<tr><td>${unite(`data-f="taille" step="1" min="1" value="${p.taille}" required`, 'pots')}</td><td>${unite(`data-f="remise" step="0.1" min="0" max="99.9" value="${pctVal(p.remise)}" required`, '%')}</td>${suppr}</tr>`;
const ligneRang = r => `<tr><td><input class="input" data-f="nom" value="${esc(r.nom)}" required></td><td>${unite(`data-f="ca" step="1" min="0" value="${r.ca}" required`, '€')}</td><td>${unite(`data-f="filleuls" step="1" min="0" value="${r.filleuls}" required`, '')}</td>${suppr}</tr>`;
const PRODUITS_AVIS = [['', '—'], ['fer', 'Fer & Énergie'], ['vit', 'Mix Vitamines'], ['pro', 'Force & Protéines']];
const ligneAvis = a => `<tr><td><input class="input" data-f="prenom" maxlength="40" value="${esc(a.prenom ?? '')}" placeholder="Marie" required></td>
  <td><input class="input" data-f="ville" maxlength="40" value="${esc(a.ville ?? '')}" placeholder="Avignon"></td>
  <td><select class="input" data-f="note">${[5, 4, 3, 2, 1].map(n => `<option value="${n}" ${Number(a.note ?? 5) === n ? 'selected' : ''}>${'★'.repeat(n)}</option>`).join('')}</select></td>
  <td><select class="input" data-f="produit">${PRODUITS_AVIS.map(([id, nom]) => `<option value="${id}" ${(a.produit ?? '') === id ? 'selected' : ''}>${nom}</option>`).join('')}</select></td>
  <td style="min-width:260px"><textarea class="input" data-f="texte" maxlength="400" rows="3" required placeholder="Texte de l'avis, tel que le client l'a écrit">${esc(a.texte ?? '')}</textarea></td>${suppr}</tr>`;
const sectionConfig = (sec, cfg) => `<form class="panel cfgsec" data-keys="${sec.champs.map(c => c.k).join(',')}" ${sec.large ? 'style="grid-column:1/-1"' : ''} novalidate>
  <h2>${sec.titre}</h2><p>${sec.aide}</p>${sec.champs.map(c => champConfig(c, cfg[c.k])).join('')}
  <div class="save"><button class="btn gold sm" type="submit">ENREGISTRER</button></div></form>`;
function lireSection(form) {
  const num = el => Number(String(el.value).replace(',', '.'));
  const pct = el => Number((num(el) / 100).toFixed(4));
  const out = {};
  for (const k of form.dataset.keys.split(',')) {
    const c = CFG_SECTIONS.flatMap(s => s.champs).find(x => x.k === k);
    if (c.t === 'bool') out[k] = form.querySelector(`[data-k="${k}"]`).checked;
    else if (c.t === 'pct') out[k] = pct(form.querySelector(`[data-k="${k}"]`));
    else if (c.t === 'nombre') out[k] = num(form.querySelector(`[data-k="${k}"]`));
    else if (c.t === 'pct3') out[k] = [...form.querySelectorAll(`[data-k="${k}"]`)].map(pct);
    else if (c.t === 'packs') out[k] = [...form.querySelectorAll('table[data-k="PACKS"] tbody tr')].map(tr => ({ taille: num(tr.querySelector('[data-f=taille]')), remise: pct(tr.querySelector('[data-f=remise]')) })).sort((a, b) => a.taille - b.taille);
    else if (c.t === 'rangs') out[k] = [...form.querySelectorAll('table[data-k="RANGS"] tbody tr')].map(tr => ({ nom: tr.querySelector('[data-f=nom]').value.trim(), ca: num(tr.querySelector('[data-f=ca]')), filleuls: num(tr.querySelector('[data-f=filleuls]')) }));
    else if (c.t === 'avis') out[k] = [...form.querySelectorAll('table[data-k="AVIS"] tbody tr')].map(tr => {
      const f = n => tr.querySelector(`[data-f=${n}]`).value.trim();
      return { prenom: f('prenom'), ville: f('ville'), note: Number(f('note')), texte: f('texte'), ...(f('produit') ? { produit: f('produit') } : {}) };
    });
  }
  return out;
}
view.addEventListener('submit', async e => {
  const form = e.target.closest('form.cfgsec'); if (!form) return;
  e.preventDefault();
  if (!form.reportValidity()) return;
  const valeurs = lireSection(form);
  const changes = Object.entries(valeurs).filter(([k, v]) => JSON.stringify(v) !== JSON.stringify(cfgActuelle[k]));
  if (!changes.length) return toast('Aucun changement');
  act(async () => { for (const [k, value] of changes) await api(`/api/admin/config/${k}`, { method: 'PUT', body: { value } }); }, 'Réglages enregistrés');
});
view.addEventListener('click', e => {
  const ligne = e.target.closest('[data-a="ligne"]');
  if (ligne) { const tb = ligne.previousElementSibling.querySelector('tbody'); tb.insertAdjacentHTML('beforeend', ligne.dataset.t === 'pack' ? lignePack({ taille: '', remise: 0 }) : ligne.dataset.t === 'avis' ? ligneAvis({ note: 5 }) : ligneRang({ nom: '', ca: 0, filleuls: 0 })); tb.lastElementChild.querySelector('input').focus(); return; }
  const del = e.target.closest('[data-a="suppr"]');
  if (del) { const tb = del.closest('tbody'); if (tb.children.length > 1 || del.closest('table[data-vide]')) del.closest('tr').remove(); else toast('Il faut garder au moins une ligne', true); return; }
});
view.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { if ('filtre' in go.dataset) { cmdFiltre = go.dataset.filtre; cmdQ = ''; sessionStorage.setItem('bz_admin_cmd', cmdFiltre); } return aller(go.dataset.go); }
  const pj = e.target.closest('[data-j]'); if (pj) { jours = Number(pj.dataset.j); sessionStorage.setItem('bz_admin_jours', jours); return render(); }
  const th = e.target.closest('th[data-k]'); if (th) { const k = th.dataset.k; revSens = k === revTri ? -revSens : (['nom', 'rang', 'parrain'].includes(k) ? 1 : -1); revTri = k; return revendeurs(); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.a === 'livrer') act(() => api(`/api/admin/commandes/${id}/livrer`, { method: 'POST' }), 'Commande marquée livrée');
  if (b.dataset.a === 'rembourser' && confirm(`Rembourser la commande ${id} ? Les commissions seront annulées.`)) act(() => api(`/api/admin/commandes/${id}/rembourser`, { method: 'POST' }), 'Remboursée');
  if (b.dataset.a === 'verser') { const ref = prompt('Référence du virement (facultatif)') ?? null; act(() => api('/api/admin/versements', { method: 'POST', body: { revendeur_id: Number(id), reference: ref } }), 'Versement enregistré'); }
  if (b.dataset.a === 'resoudre') act(() => api(`/api/admin/signalements/${id}/resoudre`, { method: 'POST' }), 'Signalement traité');
  if (b.dataset.a === 'config') {
    let value; try { value = JSON.parse(view.querySelector(`textarea[data-k="${id}"]`).value); } catch { return toast('JSON invalide', true); }
    act(() => api(`/api/admin/config/${id}`, { method: 'PUT', body: { value } }), `${id} enregistré`);
  }
});
if (TOKEN) { show(true); aller(tab); } else show(false);
</script>

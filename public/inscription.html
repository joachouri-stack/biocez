<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription revendeur — Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  main { padding: 60px 0 90px; }
  .box { max-width: 560px; margin: 0 auto; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 26px 0 22px; }
  .seg label { cursor: pointer; border: 1px solid var(--line-2); border-radius: var(--radius); padding: 14px 16px; }
  .seg input { position: absolute; opacity: 0; }
  .seg b { display: block; font-family: var(--mono); font-size: 12px; }
  .seg span { font-size: 12px; color: var(--text-lo); }
  .seg label:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
  .invite { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding: 14px 18px; border: 1px solid rgba(212,175,90,.45); border-radius: var(--radius); background: var(--gold-soft); }
  .invite .av { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #241a05; font-family: var(--mono); font-weight: 700; font-size: 18px; }
  .invite b { display: block; font-size: 15px; color: var(--text-hi); }
  .invite span { font-size: 13px; color: var(--text-lo); }
  .accept { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0 4px; font-size: 13.5px; color: var(--text-lo); cursor: pointer; line-height: 1.5; }
  .accept input { width: 18px; height: 18px; margin-top: 1px; flex: none; accent-color: var(--gold); cursor: pointer; }
  .accept span { color: var(--text-lo); font-family: var(--sans); letter-spacing: 0; }
  .accept a { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
  .legal { font-size: 11px; color: var(--text-dim); margin-top: 14px; }
</style>
</head>
<body>
<header class="site-header"></header>
<main class="auth"><div class="wrap box">
  <div class="eyebrow">Inscription gratuite</div>
  <h1>Créer mon compte <em>revendeur</em></h1>
  <div class="invite" id="invite" hidden><div class="av" id="inv-av" aria-hidden="true"></div>
    <div><b id="inv-t"></b><span>Son code est déjà enregistré : vous rejoindrez son équipe.</span></div></div>
  <form id="f" class="card" style="margin-top:26px">
    <div class="seg" role="radiogroup" aria-label="Parcours" style="margin-top:0">
      <label><input type="radio" name="parcours" value="gratuit" checked><b>COMMENCER GRATUITEMENT</b><span>Lien et code immédiats</span></label>
      <label><input type="radio" name="parcours" value="pack"><b>DÉMARRER AVEC UN PACK</b><span>Composer un pack ensuite</span></label>
    </div>
    <div class="google-bloc" data-google hidden><div class="g-btn" id="g-btn"></div><p class="form-error g-msg" id="g-err"></p><div class="ou">ou avec votre e-mail</div></div>
    <div class="row2 duo">
      <div class="field"><label for="prenom">Prénom</label><input class="input" id="prenom" required autocomplete="given-name"></div>
      <div class="field"><label for="nom">Nom</label><input class="input" id="nom" required autocomplete="family-name"></div>
    </div>
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="password">Mot de passe (8 caractères minimum)</label><input class="input" id="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="field"><label for="ville">Ville</label><input class="input" id="ville" autocomplete="address-level2"></div>
    <div class="field">
      <label for="code" id="code-label">Code parrain (facultatif)</label>
      <input class="input mono" id="code" autocomplete="off" placeholder="EX. CAMILLE-7K2Q">
      <p class="sub" id="code-info" hidden></p>
    </div>
    <label class="accept"><input type="checkbox" id="cgu" required>
      <span>J'accepte les <a href="/conditions-revendeur" target="_blank" rel="noopener">conditions revendeur</a> et la <a href="/confidentialite" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>
    <p class="form-error" id="err"></p>
    <button class="btn gold block" id="go">CRÉER MON COMPTE →</button>
    <p class="legal">Inscription gratuite, sans engagement ni achat obligatoire. Déjà inscrit ? <a href="/connexion" style="color:var(--gold)">Se connecter</a></p>
  </form>
</div></main>
<footer class="site-footer"></footer>
<script type="module">
import { api, header, footer, afficherMotsDePasse, boutonGoogle } from '/assets/app.js';
header('revendeur'); footer();
afficherMotsDePasse();
const q = new URLSearchParams(location.search);
if (q.get('parcours') === 'pack') document.querySelector('input[value=pack]').checked = true;
const { parrain } = await api('/api/ref');
if (parrain) {
  const code = document.getElementById('code');
  code.value = parrain.code; code.readOnly = true;
  const info = document.getElementById('code-info'); info.hidden = false; info.textContent = `Code de ${parrain.prenom}, déjà rempli.`;
  document.getElementById('code-label').textContent = 'Code parrain';
  document.getElementById('invite').hidden = false;
  document.getElementById('inv-av').textContent = (parrain.prenom[0] ?? '').toUpperCase();
  document.getElementById('inv-t').textContent = `${parrain.prenom} vous invite à rejoindre Biocez`;
}
const f0 = document.getElementById('f');
const destination = () => f0.parcours.value === 'pack' ? `/pack${q.get('pack') ? '?taille=' + encodeURIComponent(q.get('pack')) : ''}` : '/espace?bienvenue=1';
// « Continuer avec Google » : la case des conditions reste obligatoire. Si elle n'est pas cochée,
// on garde le jeton Google et l'inscription se termine dès que la case est cochée.
let jetonGoogle = null;
async function inscrireGoogle() {
  const gErr = document.getElementById('g-err'); gErr.textContent = '';
  try {
    const r = await api('/api/auth/google', { method: 'POST', body: { credential: jetonGoogle, accepte_conditions: true,
      code_parrain: parrain ? undefined : f0.code.value.trim() || undefined } });
    location.href = r.nouveau ? destination() : '/espace';
  } catch (x) { jetonGoogle = null; gErr.textContent = x.message; }
}
const cfg = await api('/api/config').catch(() => ({}));
boutonGoogle(document.getElementById('g-btn'), cfg.google_client_id, credential => {
  jetonGoogle = credential;
  if (f0.cgu.checked) return inscrireGoogle();
  document.getElementById('g-err').textContent = 'Cochez la case « J\'accepte les conditions » en bas du formulaire pour terminer avec Google.';
  f0.cgu.closest('label').scrollIntoView({ behavior: 'smooth', block: 'center' }); f0.cgu.focus();
}, 'signup_with');
f0.cgu.addEventListener('change', () => { if (f0.cgu.checked && jetonGoogle) inscrireGoogle(); });
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    await api('/api/auth/inscription', { method: 'POST', body: {
      prenom: f.prenom.value, nom: f.nom.value, email: f.email.value, password: f.password.value, ville: f.ville.value,
      accepte_conditions: f.cgu.checked,
      code_parrain: parrain ? undefined : f.code.value.trim() || undefined } });
    location.href = destination();
  } catch (x) { err.textContent = x.message; btn.disabled = false; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon panier — Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  main { padding: 40px 0 100px; }
  .crumb { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-bottom: 22px; }
  .crumb a:hover { color: var(--text-hi); }
  h1 { margin-bottom: 30px; }
  .layout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px; align-items: start; }
  .box { border: 1px solid var(--line); border-radius: 12px; background: var(--ink-2); }
  .items { padding: 6px 24px; }
  .item { display: grid; grid-template-columns: 84px 1fr auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item img { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; object-position: center 30%; display: block; }
  .item .n { font-family: var(--mono); font-size: 11px; margin-bottom: 4px; }
  .item h3 { font-size: 16px; margin-bottom: 10px; }
  .item h3 a:hover { text-decoration: underline; }
  .item .ctl { display: flex; align-items: center; gap: 14px; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; }
  .qty button { width: 34px; height: 34px; background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 15px; color: var(--text-hi); }
  .qty button:hover { color: var(--gold); }
  .qty output { min-width: 26px; text-align: center; font-family: var(--mono); font-size: 13px; }
  .rm { background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-decoration: underline; }
  .rm:hover { color: var(--err); }
  .item .p { font-family: var(--mono); font-size: 16px; font-weight: 700; text-align: right; }
  .item .p small { display: block; font-size: 11px; font-weight: 400; color: var(--text-dim); margin-top: 4px; }
  .empty-cart { text-align: center; padding: 60px 20px; }
  .empty-cart p { color: var(--text-lo); margin: 10px 0 24px; }

  .side { position: sticky; top: 88px; padding: 24px; }
  .totals div { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; color: var(--text-lo); }
  .totals div span:last-child { font-family: var(--mono); color: var(--text-hi); }
  .totals .grand { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; color: var(--text-hi); font-size: 16px; }
  .totals .offerte { color: var(--ok) !important; font-family: var(--sans) !important; font-weight: 600; }
  .totals .seuil { position: relative; margin: 2px 0 10px; padding: 10px 12px 14px; border-radius: 8px; background: var(--gold-soft); font-size: 13px; color: var(--text-hi); overflow: hidden; }
  .totals .seuil b { font-family: var(--mono); color: var(--gold); }
  .totals .seuil i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }
  .totals .grand span:last-child { font-size: 24px; font-weight: 700; color: var(--gold); }
  .side h2 { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin: 26px 0 14px; }
  .side .btn.pay { width: 100%; height: 56px; font-size: 14px; border-radius: 10px; margin-top: 6px; }
  .assure { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); justify-content: center; }
  .assure span::before { content: "● "; color: var(--gold); font-size: 8px; vertical-align: 2px; }
  .notice { margin-bottom: 20px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; }
  }
  @media (max-width: 560px) {
    .items { padding: 4px 16px; }
    .item { grid-template-columns: 64px 1fr; gap: 14px; }
    .item img { width: 64px; height: 64px; }
    .item .p { grid-column: 2; text-align: left; }
    .item .p small { display: inline; margin-left: 8px; }
    .side { padding: 20px 16px; }
  }
</style>
</head>
<body>
<header class="site-header"></header>
<main><div class="wrap">
  <nav class="crumb" aria-label="Fil d'Ariane"><a href="/">Accueil</a> / Panier</nav>
  <h1>Mon panier</h1>
  <p class="notice" id="annule" hidden><b>Paiement annulé.</b> Votre panier est conservé, vous pouvez reprendre votre commande.</p>
  <div class="layout" id="layout">
    <div class="box items" id="items"></div>
    <form class="box side" id="checkout">
      <div class="totals" id="totals"></div>
      <h2>Livraison</h2>
      <div class="field"><label for="c-email">E-mail</label><input class="input" id="c-email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="c-nom">Nom complet</label><input class="input" id="c-nom" required autocomplete="name"></div>
      <div class="field"><label for="c-adr">Adresse</label><input class="input" id="c-adr" required autocomplete="street-address"></div>
      <div class="row2 cp-ville">
        <div class="field"><label for="c-cp">Code postal</label><input class="input" id="c-cp" required autocomplete="postal-code" inputmode="numeric"></div>
        <div class="field"><label for="c-ville">Ville</label><input class="input" id="c-ville" required autocomplete="address-level2"></div>
      </div>
      <p class="form-error" id="c-err"></p>
      <button class="btn gold pay" id="c-pay">PAYER PAR CARTE →</button>
      <div class="assure"><span>Paiement sécurisé</span><span>Rétractation 14 jours</span></div>
    </form>
  </div>
</div></main>
<footer class="site-footer"></footer>
<script type="module">
import { api, eur, esc, getCart, setCart, header, footer, fraisLivraison } from '/assets/app.js';
import { CATALOGUE } from '/assets/catalogue.js';
header(); footer();
const cfg = await api('/api/config');
const prods = new Map(cfg.PRODUITS.map(p => [p.id, p]));
document.getElementById('annule').hidden = !new URLSearchParams(location.search).has('annule');

function render() {
  const cart = getCart();
  const ids = Object.keys(cart).filter(id => prods.has(id) && cart[id] > 0);
  const layout = document.getElementById('layout');
  if (!ids.length) {
    layout.style.display = 'block';
    layout.innerHTML = `<div class="box empty-cart"><h2>Votre panier est vide</h2><p>Découvrez nos trois formules exclusives.</p><a class="btn coral" href="/#produits">VOIR LES PRODUITS →</a></div>`;
    return;
  }
  document.getElementById('items').innerHTML = ids.map(id => {
    const p = prods.get(id), c = CATALOGUE[id] ?? {};
    return `<div class="item"><a href="/produit/${id}"><img src="${c.image ?? ''}" alt="${esc(p.nom)}"></a>
      <div><div class="n" style="color:${c.accent ?? 'var(--gold)'}">${esc(c.numero ?? '')} · ${esc(c.badge ?? '')}</div><h3><a href="/produit/${id}">${esc(p.nom)}</a></h3>
        <div class="ctl"><span class="qty"><button type="button" data-q="${id}" data-d="-1" aria-label="Retirer un pot">−</button><output>${cart[id]}</output><button type="button" data-q="${id}" data-d="1" aria-label="Ajouter un pot">+</button></span>
        <button type="button" class="rm" data-rm="${id}">Retirer</button></div></div>
      <div class="p">${eur(cart[id] * p.prix_ttc_cents)}<small>${eur(p.prix_ttc_cents)} / pot</small></div></div>`;
  }).join('');
  const total = ids.reduce((s, id) => s + cart[id] * prods.get(id).prix_ttc_cents, 0);
  const pots = ids.reduce((s, id) => s + cart[id], 0);
  const ht = Math.round(total / (1 + cfg.VAT_RATE));
  const port = fraisLivraison(total, cfg), seuil = Math.round(cfg.LIVRAISON_OFFERTE_DES * 100);
  const htPort = Math.round(port / (1 + cfg.VAT_RATE));
  document.getElementById('totals').innerHTML = `<div><span>Sous-total (${pots} pot${pots > 1 ? 's' : ''})</span><span>${eur(total)}</span></div>
    <div><span>Livraison</span><span class="${port ? '' : 'offerte'}">${port ? eur(port) : 'Offerte'}</span></div>
    ${port ? `<p class="seuil">Plus que <b>${eur(seuil - total)}</b> pour la livraison offerte.<i style="width:${Math.min(100, total / seuil * 100)}%"></i></p>` : ''}
    <div><span>Dont TVA</span><span>${eur(total + port - ht - htPort)}</span></div>
    <div class="grand"><span>Total TTC</span><span>${eur(total + port)}</span></div>`;
}
document.addEventListener('click', e => {
  const q = e.target.closest('[data-q]'), rm = e.target.closest('[data-rm]');
  if (!q && !rm) return;
  const c = getCart(), id = (q ?? rm).dataset.q ?? rm.dataset.rm;
  c[id] = rm ? 0 : Math.max(0, (c[id] || 0) + Number(q.dataset.d));
  if (!c[id]) delete c[id];
  setCart(c); render();
});
document.getElementById('checkout').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('c-pay'), err = document.getElementById('c-err');
  btn.disabled = true; err.textContent = '';
  try {
    const { url } = await api('/api/checkout/client', { method: 'POST', body: {
      items: Object.entries(getCart()).map(([produit_id, quantite]) => ({ produit_id, quantite })),
      client: { email: e.target['c-email'].value, nom: e.target['c-nom'].value, adresse: e.target['c-adr'].value,
                code_postal: e.target['c-cp'].value, ville: e.target['c-ville'].value } } });
    location.href = url;
  } catch (x) { err.textContent = x.message; btn.disabled = false; }
});
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace — Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  :root { --r: 14px; }
  main { padding: 34px 0 90px; }
  .panel { background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
  .kick { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
  .gold { color: var(--gold); }
  .muted { color: var(--text-lo); }
  .loading { padding: 120px 0; text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: 12px; }

  /* En-tête de page */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; color: #241a05;
    background: linear-gradient(135deg, #e9cf8a, var(--gold-deep)); }
  .who h1 { font-size: 26px; line-height: 1.1; }
  .who .rk { font-family: var(--mono); font-size: 12px; color: var(--gold); margin-top: 4px; }
  .top .btn { border-radius: 8px; }

  /* Onglets */
  .tabs { position: sticky; top: 64px; z-index: 30; background: rgba(14,14,13,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .tabs .wrap { display: flex; gap: 4px; }
  .tabs button { flex: 0 0 auto; background: none; border: none; cursor: pointer; padding: 16px 16px 14px; font-family: var(--mono); font-size: 13px; color: var(--text-lo);
    border-bottom: 2px solid transparent; }
  .tabs button:hover { color: var(--text-hi); }
  .tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
  [role="tabpanel"][hidden] { display: none; }
  .m-only { display: none; }

  /* Accueil */
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .earn { position: relative; overflow: hidden; padding: 30px;
    background: radial-gradient(ellipse 70% 90% at 0% 0%, rgba(212,175,90,.16), transparent 60%), var(--ink-2); border-color: rgba(212,175,90,.28); }
  .earn .big { font-size: 52px; color: var(--gold); margin: 10px 0 6px; letter-spacing: -0.02em; }
  .earn .line { font-size: 14px; color: var(--text-lo); }
  .earn .line b { color: var(--text-hi); font-family: var(--mono); }
  .pay { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pay .v { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .pay .bar { height: 6px; width: 100%; border-radius: 6px; background: rgba(245,243,238,.08); overflow: hidden; margin-top: 10px; }
  .pay .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: 6px; }

  .share { display: flex; flex-direction: column; gap: 14px; }
  .share h2 { font-size: 20px; }
  .share p { font-size: 14px; color: var(--text-lo); }
  .linkbox { display: flex; align-items: center; gap: 8px; background: var(--ink); border: 1px solid rgba(212,175,90,.35); border-radius: 10px; padding: 6px 6px 6px 14px; }
  .linkbox code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; color: var(--gold); }
  .linkbox .btn { border-radius: 8px; }
  .sharebtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sharebtns .btn { border-radius: 8px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .stat { padding: 18px 20px; }
  .stat .v { font-family: var(--mono); font-size: 26px; font-weight: 700; margin-top: 8px; }
  .stat .s { font-size: 12px; color: var(--text-lo); margin-top: 4px; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .goal { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  .ring { position: relative; width: 104px; height: 104px; }
  .ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--mono); }
  .ring .in b { display: block; font-size: 15px; color: var(--gold); }
  .ring .in small { font-size: 10px; color: var(--text-dim); }
  .goal h3 { font-size: 17px; margin-bottom: 6px; }
  .goal p { font-size: 13px; color: var(--text-lo); margin-bottom: 12px; }
  .goal p b { color: var(--text-hi); }
  .mini { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--text-lo); margin: 8px 0 5px; }
  .mini span:last-child { color: var(--text-hi); }
  .track { height: 6px; border-radius: 6px; background: rgba(245,243,238,.08); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .feed { list-style: none; }
  .feed li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .feed li:last-child { border-bottom: none; }
  .feed .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: rgba(245,243,238,.05); }
  .feed .t { font-size: 14px; }
  .feed .d { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .feed .m { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--ok); white-space: nowrap; }
  .feed .m.neg { color: var(--err); }
  .feed .m.off { color: var(--text-dim); text-decoration: line-through; font-weight: 400; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .head h2 { font-size: 18px; }
  .link { background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--gold); }
  .link:hover { text-decoration: underline; }

  .how { margin-top: 16px; }
  .how h2 { font-size: 18px; margin-bottom: 4px; }
  .how > p { font-size: 13px; color: var(--text-lo); margin-bottom: 18px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .step { padding: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink); }
  .step .p { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--gold); }
  .step h4 { font-size: 15px; margin: 6px 0 6px; }
  .step p { font-size: 13px; color: var(--text-lo); }
  .step p b { color: var(--text-hi); font-family: var(--mono); }
  .how .extra { margin-top: 14px; font-size: 13px; color: var(--text-lo); display: grid; gap: 6px; }
  .how .extra div::before { content: "✓ "; color: var(--gold); }

  .welcome, .upsell { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }
  .welcome { background: var(--gold-soft); border: 1px solid rgba(212,175,90,.35); }
  .upsell { border: 1px dashed var(--line-2); color: var(--text-lo); margin-top: 16px; margin-bottom: 0; }
  .upsell b, .welcome b { color: var(--text-hi); }

  /* Gains */
  .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .flow .panel { position: relative; }
  .flow .panel:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); z-index: 2; color: var(--text-dim); font-size: 16px; }
  .flow .v { font-family: var(--mono); font-size: 28px; font-weight: 700; margin: 10px 0 6px; }
  .flow p { font-size: 13px; color: var(--text-lo); }
  .flow .ready { border-color: rgba(212,175,90,.35); background: radial-gradient(ellipse 80% 90% at 0% 0%, rgba(212,175,90,.12), transparent 60%), var(--ink-2); }
  .flow .ready .v { color: var(--gold); }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 16px 22px; }
  .total b { font-family: var(--mono); font-size: 20px; }
  .chart { width: 100%; height: auto; display: block; margin-top: 8px; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--text-dim); }
  .chart .val { fill: var(--text-hi); font-weight: 700; }
  .src { display: grid; gap: 14px; }
  .src .row .top2 { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 10px; }
  .src .row .top2 span:last-child { font-family: var(--mono); }
  .src .row small { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
  table.simple { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.simple td, table.simple th { padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; background: none; white-space: nowrap; }
  table.simple th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; }
  table.simple tr:last-child td { border-bottom: none; }
  table.simple .r { text-align: right; font-family: var(--mono); }

  /* Équipe */
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .lvl { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--ink-2); border-radius: var(--r); padding: 18px 20px; color: var(--text-hi); }
  .lvl:hover { border-color: var(--line-2); }
  .lvl[aria-pressed="true"] { border-color: var(--gold); background: radial-gradient(ellipse 80% 90% at 0% 0%, rgba(212,175,90,.12), transparent 60%), var(--ink-2); }
  .lvl .n { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: .06em; }
  .lvl .c { font-family: var(--mono); font-size: 30px; font-weight: 700; margin: 8px 0 4px; }
  .lvl p { font-size: 12.5px; color: var(--text-lo); }
  .lvl .g { font-family: var(--mono); font-size: 12px; color: var(--text-hi); margin-top: 10px; }
  .tools { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .tools .input { width: auto; flex: 1; max-width: 320px; border-radius: 8px; }
  .people { display: grid; gap: 8px; }
  .person { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); }
  .person .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; background: rgba(245,243,238,.06); color: var(--text-hi); }
  .person .nm { font-weight: 600; }
  .person .meta { font-size: 12px; color: var(--text-lo); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .person .ca { text-align: right; font-family: var(--mono); font-weight: 700; }
  .person .ca small { display: block; font-weight: 400; font-size: 11px; color: var(--text-dim); }
  .dot { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; }
  .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.on { color: var(--ok); } .dot.off { color: var(--text-dim); }
  .tag { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 3px; background: var(--gold-soft); color: var(--gold); }
  .empty { padding: 34px; text-align: center; color: var(--text-lo); font-size: 14px; border: 1px dashed var(--line-2); border-radius: var(--r); }

  /* Classement */
  .rank-teaser { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 16px; padding: 16px 20px; border-radius: var(--r); cursor: pointer; text-align: left; color: var(--text-hi);
    border: 1px solid rgba(212,175,90,.3); background: linear-gradient(90deg, rgba(212,175,90,.12), transparent 70%), var(--ink-2); font-size: 14px; }
  .rank-teaser:hover { border-color: var(--gold); }
  .rank-teaser .pos { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--gold); }
  .rank-teaser .go { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--gold); white-space: nowrap; }
  .lb-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .lb-head h2 { font-size: 22px; }
  .lb-head p { font-size: 13px; margin-top: 4px; }
  .me-card { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 18px 22px; border-radius: var(--r); margin-bottom: 18px;
    border: 1px solid rgba(212,175,90,.35); background: radial-gradient(ellipse 70% 100% at 0% 0%, rgba(212,175,90,.14), transparent 60%), var(--ink-2); }
  .lb-opt { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; padding: 12px 16px; border: 1px solid var(--line-2); border-radius: var(--r); cursor: pointer; font-size: 14px; }
  .lb-opt input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold); flex: none; cursor: pointer; }
  .lb-opt small { display: block; color: var(--text-lo); font-size: 12.5px; margin-top: 2px; }
  .me-card .pos { font-family: var(--mono); font-size: 34px; font-weight: 700; color: var(--gold); line-height: 1; }
  .me-card .pos small { font-size: 14px; color: var(--text-lo); font-weight: 400; }
  .me-card .txt { flex: 1; min-width: 200px; font-size: 14px; color: var(--text-lo); }
  .me-card .txt b { color: var(--text-hi); }
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 12px; align-items: end; margin-bottom: 14px; }
  .pod { text-align: center; padding: 22px 14px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--ink-2); }
  .pod.p1 { order: 2; padding-top: 30px; border-color: rgba(212,175,90,.45); background: radial-gradient(ellipse 80% 70% at 50% 0%, rgba(212,175,90,.18), transparent 70%), var(--ink-2); }
  .pod.p2 { order: 1; } .pod.p3 { order: 3; }
  .pod.me { box-shadow: 0 0 0 2px var(--gold) inset; }
  .medal { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 17px; color: #1a1406; }
  .pod.p1 .medal { width: 54px; height: 54px; font-size: 21px; background: linear-gradient(135deg, #f1d98f, #c9972f); }
  .pod.p2 .medal { background: linear-gradient(135deg, #eeeeea, #9d9c97); }
  .pod.p3 .medal { background: linear-gradient(135deg, #e6b48a, #9c6134); }
  .pod .nm { font-weight: 600; font-size: 15px; }
  .pod .ct { font-size: 12px; color: var(--text-lo); margin-top: 2px; }
  .pod .vv { font-family: var(--mono); font-weight: 700; font-size: 18px; margin-top: 10px; }
  .pod.p1 .vv { color: var(--gold); font-size: 21px; }
  .lb { list-style: none; display: grid; gap: 6px; }
  .lb li { display: grid; grid-template-columns: 40px 38px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); }
  .lb li.me { border-color: var(--gold); background: radial-gradient(ellipse 60% 100% at 0% 50%, rgba(212,175,90,.12), transparent 70%), var(--ink-2); }
  .lb .n { font-family: var(--mono); font-weight: 700; color: var(--text-lo); text-align: center; }
  .lb .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; background: rgba(245,243,238,.06); }
  .lb .nm { font-weight: 600; font-size: 14px; }
  .lb .ct { font-size: 12px; color: var(--text-lo); margin-top: 2px; }
  .lb .vv { font-family: var(--mono); font-weight: 700; text-align: right; white-space: nowrap; }
  .lb .vv small { display: block; font-weight: 400; font-size: 11px; color: var(--text-dim); }
  .lb-per button { padding: 10px 14px; }

  /* Simulateur */
  .sim { display: grid; grid-template-columns: 1fr 1.1fr; gap: 16px; align-items: start; }
  .f { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .f:last-child { border-bottom: none; }
  .f .t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .f label { font-size: 14px; }
  .f output { font-family: var(--mono); font-weight: 700; color: var(--gold); font-size: 16px; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(245,243,238,.12); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink-2); box-shadow: 0 0 0 1px var(--gold); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink-2); box-shadow: 0 0 0 1px var(--gold); cursor: pointer; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(212,175,90,.45); }
  details.adv { margin-top: 6px; border-top: 1px solid var(--line); }
  details.adv summary { cursor: pointer; list-style: none; padding: 14px 0; font-family: var(--mono); font-size: 12px; color: var(--text-lo); }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before { content: "+ "; color: var(--gold); }
  details.adv[open] summary::before { content: "− "; }
  .seg { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: none; border: none; padding: 10px 6px; font-family: var(--mono); font-size: 11px; color: var(--text-lo); cursor: pointer; border-left: 1px solid var(--line-2); }
  .seg button:first-child { border-left: none; }
  .seg button.on { background: var(--gold); color: #241a05; font-weight: 700; }
  .res { position: sticky; top: 130px; text-align: center; padding: 30px;
    background: radial-gradient(ellipse 80% 70% at 50% 0%, rgba(212,175,90,.14), transparent 65%), var(--ink-2); border-color: rgba(212,175,90,.28); }
  .res .big { font-size: 54px; color: var(--gold); margin: 8px 0 2px; }
  .res .sub2 { font-size: 14px; color: var(--text-lo); }
  .res .year { display: flex; justify-content: center; gap: 30px; margin: 22px 0 6px; flex-wrap: wrap; }
  .res .year div { font-family: var(--mono); font-size: 12px; color: var(--text-lo); }
  .res .year b { display: block; font-size: 20px; color: var(--text-hi); margin-top: 4px; }
  .res .lev { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: rgba(245,243,238,.04); font-size: 13px; color: var(--text-lo); text-align: left; }
  .res .lev b { color: var(--text-hi); font-family: var(--mono); }
  .warn { margin-top: 14px; font-size: 12px; color: var(--text-hi); text-align: left; padding: 10px 14px; border-left: 3px solid var(--gold); background: rgba(245,243,238,.03); }
  .hyp { margin-top: 10px; font-size: 11px; color: var(--text-dim); text-align: left; }

  @media (max-width: 960px) {
    .hero, .two, .sim { grid-template-columns: minmax(0, 1fr); }
    .stats { grid-template-columns: 1fr 1fr; }
    .res { position: static; }
  }
  @media (max-width: 700px) {
    main { padding-top: 22px; }
    .who h1 { font-size: 22px; }
    .top .btn { display: none; }
    .tabs .wrap { gap: 0; padding: 0; }
    .tabs button { flex: 1; padding: 14px 4px 12px; font-size: 12px; }
    .d-only { display: none; } .m-only { display: inline; }
    .panel { padding: 18px; }
    .earn { padding: 22px; }
    .earn .big { font-size: 42px; }
    .stat { padding: 14px 16px; }
    .stat .v { font-size: 21px; }
    .goal { grid-template-columns: 1fr; justify-items: start; }
    .steps, .flow, .levels { grid-template-columns: minmax(0, 1fr); }
    .flow .panel:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -15px; transform: translateX(-50%); }
    .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .lvl { padding: 12px; } .lvl .c { font-size: 22px; } .lvl p, .lvl .g { display: none; }
    .res .big { font-size: 42px; }
    .podium { gap: 6px; } .pod { padding: 14px 6px 12px; } .pod.p1 { padding-top: 20px; }
    .pod .nm { font-size: 13px; } .pod .vv { font-size: 14px; } .pod.p1 .vv { font-size: 16px; }
    .medal { width: 36px; height: 36px; font-size: 14px; } .pod.p1 .medal { width: 44px; height: 44px; font-size: 17px; }
    .lb li { grid-template-columns: 28px 1fr auto; padding: 11px 12px; gap: 10px; } .lb .av { display: none; }
    .rank-teaser .go { display: none; }
  }
</style>
</head>
<body>
<header class="site-header"></header>
<div id="app"><p class="loading">CHARGEMENT…</p></div>
<footer class="site-footer"></footer>

<template id="tpl">
  <main><div class="wrap">
    <div class="top">

  <div class="wrap">

        <div class="panel earn">

          <div><div class="kick">Votre action n°1</div><h2 style="margin-top:6px">Partagez votre lien</h2></div>

        <div class="panel"><div class="head"><h2>Dernières activités</h2><button class="link" data-go="gains">Tout voir →</button></div><ul class="feed" id="feed"></ul></div>

      </div>
      <div class="two">
        <div class="panel"><div class="head"><h2>Activité récente</h2></div><ul class="feed" id="feed-all"></ul><button class="btn sm" id="more" style="width:100%;margin-top:12px;border-radius:8px" hidden>VOIR PLUS</button></div>
        <div class="panel"><div class="head"><h2>Versements reçus</h2></div><div style="overflow-x:auto"><table class="simple" id="payouts"></table></div></div>
      </div>
    </section>

    <!-- ÉQUIPE -->
    <section role="tabpanel" id="p-equipe" aria-labelledby="t-equipe" hidden>
      <div class="levels" id="levels"></div>

      <div class="tools">
        <input class="input" id="q" type="search" placeholder="Rechercher un nom, une ville…" aria-label="Rechercher">
        <select class="input" id="st" style="max-width:190px" aria-label="Filtrer">
          <option value="">Tout le monde</option><option value="actif">Actifs</option><option value="inactif">Inactifs</option><option value="pack">Avec pack</option>

      </div>
      <label class="lb-opt"><input type="checkbox" id="lb-visible"><span><b>Apparaître dans le classement national</b>
        <small>Décoché : votre prénom n'est plus visible par les autres revendeurs. Vous continuez à voir votre position, pour vous seul.</small></span></label>

      <div class="sim">

          <div class="f"><div class="t"><label for="s-v">Je vends chaque mois</label><output id="o-v"></output></div><input type="range" id="s-v" min="0" max="100" value="10"></div>
          <div class="f"><div class="t"><label for="s-n1">Je recrute chaque mois</label><output id="o-n1"></output></div><input type="range" id="s-n1" min="0" max="10" value="2"></div>
          <div class="f"><div class="t"><label for="s-p">Chaque filleul vend par mois</label><output id="o-p"></output></div><input type="range" id="s-p" min="0" max="50" value="5"></div>
          <details class="adv">
            <summary>Réglages avancés</summary>
            <div class="f"><div class="t"><label for="s-n2">Recrutés par mes filleuls / mois (niveau 2)</label><output id="o-n2"></output></div><input type="range" id="s-n2" min="0" max="30" value="1"></div>
            <div class="f"><div class="t"><label for="s-n3">Recrutés au niveau 3 / mois</label><output id="o-n3"></output></div><input type="range" id="s-n3" min="0" max="60" value="0"></div>
            <div class="f"><div class="t"><label for="s-a">Filleuls qui vendent vraiment</label><output id="o-a"></output></div><input type="range" id="s-a" min="0" max="100" step="5" value="50"></div>
            <div class="f"><div class="t"><label for="s-k">Filleuls qui prennent un pack</label><output id="o-k"></output></div><input type="range" id="s-k" min="0" max="100" step="5" value="30"></div>

          <svg class="chart" id="r-chart" viewBox="0 0 640 200" role="img" aria-label="Projection mois par mois"></svg>
          <div class="lev" id="r-lev"></div>
          <p class="warn">Estimation indicative, sans garantie de gains. Les résultats dépendent de vos ventes réelles.</p>
          <p class="hyp" id="r-hyp"></p>
        </div>
      </div>
    </section>

  </div></main>
</template>

<script type="module">
import { api, eur, eur0, pct, fdate, esc, header, footer, copier, toast } from '/assets/app.js';

const me = await header('espace'); footer();
if (!me) { location.href = '/connexion?suite=/espace'; throw new Error('non connecté'); }
const D = await api('/api/me/dashboard');
const C = D.config, G = D.gains, PS = G.par_statut, L = D.lien;
document.getElementById('app').replaceChildren(document.getElementById('tpl').content.cloneNode(true));
const $ = id => document.getElementById(id);
const TV = C.TAUX_VENTE_CLIENT, TP = C.PACK_COMMISSION_ENABLED ? C.TAUX_PACK : [];

// ---------- Onglets (#accueil, #gains, #equipe, #simulateur ; #filleuls = #equipe pour les anciens liens)
const TABS = ['accueil', 'gains', 'equipe', 'classement', 'simulateur'];
function montrer(t, scroll = true) {
  if (!TABS.includes(t)) t = 'accueil';
  for (const x of TABS) { $('t-' + x).setAttribute('aria-selected', x === t); $('p-' + x).hidden = x !== t; }
  history.replaceState(null, '', '#' + t);
  if (scroll) window.scrollTo({ top: 0, behavior: 'instant' });
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) montrer(b.id.slice(2)); });
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const vis = TABS.filter(t => !$('t-' + t).hidden), i = vis.indexOf(location.hash.slice(1)), n = vis[(i + (e.key === 'ArrowRight' ? 1 : vis.length - 1)) % vis.length];
  montrer(n); $('t-' + n).focus();
});
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) montrer(b.dataset.go); });
const depuisAdresse = () => ({ filleuls: 'equipe', lien: 'accueil', vue: 'accueil' }[location.hash.slice(1)] ?? location.hash.slice(1));
montrer(depuisAdresse(), false);
window.addEventListener('hashchange', () => montrer(depuisAdresse()));

// ---------- En-tête
$('av').textContent = (D.me.prenom[0] + D.me.nom[0]).toUpperCase();
$('hello').textContent = `Bonjour ${D.me.prenom}`;
$('rk').textContent = `Ambassadeur ${D.rang.actuel.nom} · ${D.me.statut === 'pack' ? 'avec pack' : 'sans pack'}`;
$('logout').onclick = async () => { await api('/api/auth/deconnexion', { method: 'POST' }); location.href = '/'; };
if (new URLSearchParams(location.search).has('bienvenue')) {
  const w = $('welcome'); w.hidden = false;
  w.innerHTML = `<span><b>Bienvenue ${esc(D.me.prenom)} !</b> Votre compte est actif. Première étape : partagez votre lien ci-dessous.</span>`;
}
$('upsell').hidden = D.me.statut === 'pack';

// ---------- Accueil : gains du mois et prochain versement
const now = new Date();
$('mois').textContent = `Gagné en ${now.toLocaleDateString('fr-FR', { month: 'long' })}`;
$('gm').textContent = eur(D.kpis.gains_mois_cents);
$('gm-line').innerHTML = `Depuis le début : <b>${eur0(G.cumules_cents)}</b> · déjà reçu : <b>${eur0(PS.versee)}</b>`;
const seuil = C.PAYOUT_MIN * 100;
if (PS.payable > 0) {
  $('pay').innerHTML = `<div><div class="kick">Prêt à être versé</div><div class="v gold">${eur(PS.payable)}</div></div><span class="muted" style="font-size:13px">Virement en cours de préparation</span>`;
} else {
  const manque = Math.max(0, seuil - PS.validee);
  $('pay').innerHTML = `<div style="flex:1"><div class="kick">Prochain versement</div>
    <div style="font-size:14px;margin-top:6px">${PS.validee > 0 ? `<b class="mono">${eur(PS.validee)}</b> confirmés · ` : ''}encore <b class="mono">${eur(manque)}</b> avant un virement (dès ${eur0(seuil)})</div>
    <div class="bar"><i style="width:${Math.min(100, PS.validee / seuil * 100)}%"></i></div></div>`;
}

// Lien
$('link').textContent = L.url;
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copier(L.url)));
const msg = `Je te recommande Biocez : des compléments 100 % naturels aux formules exclusives. C'est par ici : ${L.url}`;
$('sharebtns').innerHTML = [
  ['WHATSAPP', `https://wa.me/?text=${encodeURIComponent(msg)}`],
  ['SMS', `sms:?&body=${encodeURIComponent(msg)}`],
  ['E-MAIL', `mailto:?subject=${encodeURIComponent('Découvre Biocez')}&body=${encodeURIComponent(msg)}`],
].map(([t, u]) => `<a class="btn sm" href="${u}" target="_blank" rel="noopener">${t}</a>`).join('');

// Chiffres clés
const tile = (k, v, s) => `<div class="panel stat"><div class="kick">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
$('stats').innerHTML =
  tile('Mes ventes', eur0(D.kpis.ca_cents), `+${eur0(D.kpis.ca_30j_cents)} ce mois-ci`) +
  tile('Mon équipe', D.kpis.nb_filleuls, `${D.kpis.nb_par_niveau[0]} invités directement`) +
  tile('Clients fidèles', L.clients_fideles, 'commandent via vous') +
  tile('Visites de mon lien', L.clics, `${L.clics_30j} ce mois-ci`);

// Objectif (rang suivant)
const { actuel, suivant, index } = D.rang;
const ca = D.kpis.ca_cents, nf = D.kpis.nb_filleuls;
const pCa = suivant ? Math.min(1, ca / (suivant.ca * 100 || 1)) : 1, pFi = suivant ? Math.min(1, nf / (suivant.filleuls || 1)) : 1;
const prog = (pCa + pFi) / 2, CIRC = 2 * Math.PI * 44;
const ring = `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
  <circle cx="52" cy="52" r="44" fill="none" stroke="rgba(245,243,238,0.08)" stroke-width="7"/>
  <circle cx="52" cy="52" r="44" fill="none" stroke="#d4af5a" stroke-width="7" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - prog)}" transform="rotate(-90 52 52)"/></svg>
  <div class="in"><div><b>${esc(actuel.nom.toUpperCase())}</b><small>${Math.round(prog * 100)} %</small></div></div></div>`;
if (suivant) {
  const mCa = Math.max(0, suivant.ca * 100 - ca), mFi = Math.max(0, suivant.filleuls - nf), parts = [];
  if (mCa) parts.push(`<b>${eur0(mCa)}</b> de ventes`);
  if (mFi) parts.push(`<b>${mFi} membre${mFi > 1 ? 's' : ''}</b> dans votre équipe`);
  $('goal').innerHTML = `${ring}<div><div class="kick">Prochain objectif</div><h3 style="margin-top:4px">Devenir ${esc(suivant.nom)}</h3>
    <p>Encore ${parts.join(' et ')}.</p>
    <div class="mini"><span>Ventes</span><span>${eur0(ca)} / ${eur0(suivant.ca * 100)}</span></div><div class="track"><i style="width:0" data-w="${pCa * 100}"></i></div>
    <div class="mini"><span>Équipe</span><span>${nf} / ${suivant.filleuls}</span></div><div class="track"><i style="width:0" data-w="${pFi * 100}"></i></div></div>`;
} else {
  $('goal').innerHTML = `${ring}<div><div class="kick">Rang maximum</div><h3 style="margin-top:4px">Vous êtes ${esc(actuel.nom)}</h3><p>Le plus haut rang du réseau Biocez. Bravo !</p></div>`;
}
requestAnimationFrame(() => document.querySelectorAll('.track i[data-w]').forEach(i => { i.style.width = i.dataset.w + '%'; }));

// Fil d'activité en langage clair
const initiale = n => (n ? n[0] + '.' : '');
const quand = iso => {
  const j = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 864e5);
  return j <= 0 ? "aujourd'hui" : j === 1 ? 'hier' : j < 7 ? `il y a ${j} jours` : fdate(iso);
};
function activite(c) {
  const qui = c.source_prenom ? `${esc(c.source_prenom)} ${esc(initiale(c.source_nom))}` : '';
  const role = ['', 'votre filleul', 'équipe · niveau 2', 'équipe · niveau 3'][c.niveau] ?? '';
  let ic = '🛒', t;
  if (c.regularisation) { ic = '↩'; t = 'Correction après un remboursement'; }
  else if (c.type === 'pack') { ic = '📦'; t = `${qui} a démarré avec un pack <span class="muted">(${role})</span>`; }
  else if (c.niveau === 0) t = 'Vente à un de vos clients';
  else { ic = '👥'; t = `Vente de ${qui} <span class="muted">(${role})</span>`; }
  const etat = { en_attente: 'en cours de validation', validee: 'confirmé', payable: 'prêt à être versé', versee: 'reçu', annulee: 'annulé (remboursement)' }[c.statut];
  const cls = c.statut === 'annulee' ? 'off' : c.montant_cents < 0 ? 'neg' : '';
  return `<li><span class="ic" aria-hidden="true">${ic}</span><div><div class="t">${t}</div><div class="d">${quand(c.created_at)} · ${etat}</div></div>
    <span class="m ${cls}">${c.montant_cents < 0 ? '' : '+'}${eur(c.montant_cents)}</span></li>`;
}
const vide = '<li style="display:block;color:var(--text-lo);font-size:14px;padding:18px 0">Pas encore d\'activité. Partagez votre lien pour faire votre première vente.</li>';
$('feed').innerHTML = G.dernieres_commissions.slice(0, 5).map(activite).join('') || vide;
let nbAct = 10;
const renderAct = () => {
  $('feed-all').innerHTML = G.dernieres_commissions.slice(0, nbAct).map(activite).join('') || vide;
  $('more').hidden = nbAct >= G.dernieres_commissions.length;
};
$('more').onclick = () => { nbAct += 10; renderAct(); };
renderAct();

// Comment je gagne
$('how').innerHTML = `<h2>Comment je gagne de l'argent ?</h2><p>Sur le prix hors taxes de chaque commande. Exemple avec un pot de ${esc(C.PRODUITS[0].nom)}.</p>
  <div class="steps">${[
    [TV[0], 'Vous vendez', 'Un client commande avec votre lien, ou revient commander plus tard.'],
    [TV[1], 'Votre filleul vend', 'Une personne que vous avez invitée fait une vente.'],
    [TV[2], 'Son filleul vend', 'Une personne invitée par votre filleul fait une vente.'],
  ].filter(s => s[0]).map(([t, h, p]) => {
    const gain = Math.round(C.PRODUITS[0].prix_ttc_cents / (1 + C.VAT_RATE) * t);
    return `<div class="step"><div class="p">${pct(t)}</div><h4>${h}</h4><p>${p}<br>Soit <b>${eur(gain)}</b> pour vous par pot.</p></div>`;
  }).join('')}</div>
  <div class="extra">
    ${TP[0] ? `<div>Quand un filleul démarre avec un pack, vous touchez aussi <b>${pct(TP[0])}</b> du pack${C.PACK_COMMISSION_FIRST_ONLY ? ' (premier pack)' : ''}.</div>` : ''}
    ${C.CLIENT_RATTACHE_DEFINITIF ? '<div>Vos clients vous restent rattachés pour toujours, même s\'ils reviennent sans votre lien.</div>' : ''}
    <div>Vos gains sont confirmés ${C.RETRACTATION_JOURS} jours après la livraison, puis versés dès ${eur0(seuil)}.</div>
  </div>`;

// ---------- Gains
const enCours = PS.en_attente + PS.validee;
$('flow').innerHTML = `
  <div class="panel"><div class="kick">1 · En cours de validation</div><div class="v">${eur(enCours)}</div><p>Commandes récentes. Confirmées ${C.RETRACTATION_JOURS} jours après la livraison.</p></div>
  <div class="panel ready"><div class="kick">2 · Prêt à être versé</div><div class="v">${eur(PS.payable)}</div><p>${PS.payable ? 'Le virement est en préparation.' : `Débloqué dès ${eur0(seuil)} confirmés.`}</p></div>
  <div class="panel"><div class="kick">3 · Déjà reçu</div><div class="v">${eur(PS.versee)}</div><p>${G.versements.length} virement${G.versements.length > 1 ? 's' : ''} reçu${G.versements.length > 1 ? 's' : ''} sur votre compte.</p></div>`;
$('total').innerHTML = `<span class="muted">Total gagné depuis le début${PS.annulee ? ` <span style="font-size:12px">(hors ${eur(PS.annulee)} annulés suite à des remboursements)</span>` : ''}</span><b class="gold">${eur(G.cumules_cents)}</b>`;

function barres(svg, vals, labels, titres, surligne) {
  const W = 640, H = +svg.getAttribute('viewBox').split(' ')[3], pb = 22, pt = 22;
  const max = Math.max(...vals, 100), bw = W / vals.length;
  svg.innerHTML = vals.map((v, i) => {
    const h = (H - pb - pt) * v / max, x = i * bw + bw * .18, w = bw * .64, y = H - pb - h, on = i === surligne;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 1)}" rx="3" fill="${on ? '#d4af5a' : 'rgba(212,175,90,0.35)'}"><title>${titres[i]} : ${eur(v)}</title></rect>
      ${on ? `<text class="val" x="${x + w / 2}" y="${y - 7}" text-anchor="middle">${eur0(v)}</text>` : ''}
      <text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`;
  }).join('');
}
const mois = []; for (let i = 11; i >= 0; i--) mois.push(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - i, 1)));
const cle = d => d.toISOString().slice(0, 7);
barres($('chart'), mois.map(m => G.par_mois.filter(x => x.mois === cle(m)).reduce((a, x) => a + x.s, 0)),
  mois.map(m => m.toLocaleDateString('fr-FR', { month: 'short', timeZone: 'UTC' }).replace('.', '')),
  mois.map(m => m.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' })), 11);

const SOURCES = [
  [0, 'Mes ventes', `${pct(TV[0] ?? 0)} de chaque vente`],
  [1, 'Mes filleuls', 'ventes et packs de niveau 1'],
  [2, 'Équipe niveau 2', 'ventes et packs'],
  [3, 'Équipe niveau 3', 'packs'],
];
const parSrc = SOURCES.map(([n]) => G.par_source.filter(x => x.niveau === n).reduce((a, x) => a + x.s, 0));
const totSrc = Math.max(1, parSrc.reduce((a, b) => a + b, 0));
$('src').innerHTML = SOURCES.map(([, t, s], i) => `<div class="row"><div class="top2"><span>${t} <small>· ${s}</small></span><span>${eur0(parSrc[i])}</span></div>
  <div class="track"><i style="width:${parSrc[i] / totSrc * 100}%"></i></div></div>`).join('');
$('payouts').innerHTML = G.versements.length
  ? `<thead><tr><th>Date</th><th>Référence</th><th class="r">Montant</th></tr></thead><tbody>${G.versements.map(v => `<tr><td class="mono">${fdate(v.date_versement)}</td><td class="mono muted">${esc(v.reference ?? '—')}</td><td class="r">${eur(v.montant_cents)}</td></tr>`).join('')}</tbody>`
  : `<tbody><tr><td class="muted" style="white-space:normal">Aucun virement pour l'instant. Le premier arrive dès ${eur0(seuil)} de gains confirmés.</td></tr></tbody>`;

// ---------- Équipe
let niv = 1;
const EXPL = { 1: 'Les personnes que vous avez invitées vous-même.', 2: 'Les personnes invitées par vos filleuls.', 3: 'Les personnes invitées au niveau suivant.' };
function renderEquipe() {
  $('levels').innerHTML = D.niveaux.map(n => `<button class="lvl" aria-pressed="${n.niveau === niv}" data-n="${n.niveau}">
    <div class="n">NIVEAU ${n.niveau}</div><div class="c">${n.filleuls.length}</div><p>${EXPL[n.niveau]}</p><div class="g">Vous a rapporté ${eur0(n.commissions_cents)}</div></button>`).join('');
  $('lvl-expl').textContent = EXPL[niv];
  const q = $('q').value.trim().toLowerCase(), st = $('st').value;
  const liste = D.niveaux[niv - 1].filleuls
    .filter(r => !q || `${r.prenom} ${r.nom} ${r.ville ?? ''}`.toLowerCase().includes(q))
    .filter(r => !st || (st === 'actif' ? r.actif : st === 'inactif' ? !r.actif : r.pack))
    .sort((a, b) => b.ca_cents - a.ca_cents);
  $('people').innerHTML = liste.map(r => `<div class="person"><div class="av">${esc((r.prenom[0] + r.nom[0]).toUpperCase())}</div>
    <div><div class="nm">${esc(r.prenom)} ${esc(r.nom)}</div><div class="meta">${r.actif ? '<span class="dot on">Actif</span>' : '<span class="dot off">Inactif</span>'}
      ${r.pack ? '<span class="tag">Pack</span>' : ''}<span>${esc(r.ville ?? '')}</span><span>· depuis ${fdate(r.date_inscription)}</span>${r.parrain ? `<span>· invité·e par ${esc(r.parrain)}</span>` : ''}</div></div>
    <div class="ca">${eur0(r.ca_cents)}<small>de ventes</small></div></div>`).join('')
    || `<div class="empty">${D.niveaux[niv - 1].filleuls.length ? 'Personne ne correspond à cette recherche.' : niv === 1 ? 'Pas encore de filleul. Partagez votre lien : chaque inscription rejoint votre équipe.' : 'Personne à ce niveau pour le moment.'}</div>`;
}
$('levels').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (b) { niv = +b.dataset.n; renderEquipe(); } });
$('q').addEventListener('input', renderEquipe); $('st').addEventListener('change', renderEquipe);
renderEquipe();

// ---------- Classement national (ventes clients)
let periodeLb = 'mois';
const place = n => n === 1 ? '1er' : `${n}e`;
async function renderClassement() {
  const c = await api('/api/me/classement?periode=' + periodeLb);
  if (!c.actif) return;
  const libelle = periodeLb === 'mois' ? `en ${new Date().toLocaleDateString('fr-FR', { month: 'long' })}` : 'depuis le lancement';
  $('lb-sub').textContent = `Les 30 meilleurs revendeurs de France ${libelle} · ${c.participants} revendeur${c.participants > 1 ? 's' : ''} classé${c.participants > 1 ? 's' : ''}`;
  document.querySelectorAll('.lb-per button').forEach(b => b.classList.toggle('on', b.dataset.per === periodeLb));
  const M = c.moi;
  $('lb-visible').checked = c.visible;
  $('lb-me').innerHTML = M
    ? `<div class="pos">${place(M.position)} <small>/ ${c.participants + (M.masque ? 1 : 0)}</small></div><div class="txt">${M.masque ? '<b>Vous êtes masqué du classement.</b> Position visible par vous seul' : '<b>Votre position</b>'} ${libelle} avec ${eur0(M.ventes_ttc_cents)} de ventes.
        ${M.position === 1 ? ' Vous êtes en tête, bravo !' : ` Encore <b class="mono">${eur(M.ecart_place_suivante_cents)}</b> de ventes pour passer ${place(M.position - 1)}.`}</div>`
    : `<div class="pos">—</div><div class="txt"><b>Vous n'êtes pas encore classé ${libelle}.</b> Une seule vente suffit pour entrer dans le classement : partagez votre lien.</div>`;
  const nom = r => `${esc(r.prenom)} ${esc(r.initiale)}`;
  const ville = r => [r.ville, r.rang].filter(Boolean).map(esc).join(' · ');
  $('podium').innerHTML = c.top.slice(0, 3).map(r => `<div class="pod p${r.position} ${r.moi ? 'me' : ''}"><div class="medal">${r.position}</div>
    <div class="nm">${nom(r)}${r.moi ? ' <span class="gold">(vous)</span>' : ''}</div><div class="ct">${ville(r)}</div><div class="vv">${eur0(r.ventes_ttc_cents)}</div></div>`).join('');
  $('lb').innerHTML = c.top.slice(3).map(r => `<li class="${r.moi ? 'me' : ''}"><span class="n">${r.position}</span>
    <span class="av" aria-hidden="true">${esc((r.prenom[0] ?? '') + (r.initiale[0] ?? ''))}</span>
    <div><div class="nm">${nom(r)}${r.moi ? ' <span class="gold">(vous)</span>' : ''}</div><div class="ct">${ville(r)}</div></div>
    <div class="vv">${eur0(r.ventes_ttc_cents)}<small>${r.nb_ventes} vente${r.nb_ventes > 1 ? 's' : ''}</small></div></li>`).join('')
    + (M && M.position > c.top.length ? `<li class="me"><span class="n">${M.position}</span><span class="av" aria-hidden="true">${esc(D.me.prenom[0] + D.me.nom[0])}</span>
      <div><div class="nm">${nom(M)} <span class="gold">(vous)</span></div><div class="ct">${ville(M)}</div></div><div class="vv">${eur0(M.ventes_ttc_cents)}<small>${M.nb_ventes} vente${M.nb_ventes > 1 ? 's' : ''}</small></div></li>` : '');
  if (!c.top.length) $('podium').innerHTML = '<div class="empty" style="grid-column:1/-1">Personne n\'est encore classé sur cette période. La première vente prend la tête !</div>';
  if (periodeLb === 'mois') {
    const t = $('rank-teaser'); t.hidden = false;
    t.innerHTML = M ? `<span aria-hidden="true">🏆</span><span class="pos">${place(M.position)}</span><span>sur ${c.participants + (M.masque ? 1 : 0)} revendeurs en France ce mois-ci${M.position > 1 ? ` · encore <b class="mono">${eur0(M.ecart_place_suivante_cents)}</b> pour gagner une place` : ' · vous êtes en tête !'}</span><span class="go">Voir le classement →</span>`
      : `<span aria-hidden="true">🏆</span><span>Faites une vente ce mois-ci pour entrer dans le <b>classement national</b>.</span><span class="go">Voir le classement →</span>`;
  }
  $('t-classement').hidden = false;
}
$('lb-visible').addEventListener('change', async e => {
  const v = e.target.checked;
  try {
    await api('/api/me/preferences', { method: 'PUT', body: { classement_visible: v } });
    toast(v ? 'Vous apparaissez dans le classement national' : 'Vous êtes masqué du classement');
    renderClassement();
  } catch (err) { e.target.checked = !v; toast(err.message, true); }
});
document.querySelector('.lb-per').addEventListener('click', e => { const b = e.target.closest('[data-per]'); if (b) { periodeLb = b.dataset.per; renderClassement(); } });
renderClassement().catch(() => {});

// ---------- Simulateur (taux et remises lus depuis la configuration)
const prixTtc = C.PRODUITS.reduce((a, p) => a + p.prix_ttc_cents, 0) / C.PRODUITS.length, prixHt = prixTtc / (1 + C.VAT_RATE);
const packHt = t => { const p = C.PACKS.find(x => x.taille === t); return t * prixTtc * (1 - p.remise) / (1 + C.VAT_RATE); };
const S = { v: 10, n1: 2, p: 5, n2: 1, n3: 0, a: 50, k: 30, pk: C.PACKS[0].taille };
$('s-pk').innerHTML = C.PACKS.map(p => `<button type="button" data-v="${p.taille}">PACK ${p.taille}</button>`).join('');
function simuler() {
  const neu = [S.n1, S.n2, S.n3]; let cum = [0, 0, 0]; const out = [];
  for (let m = 0; m < 12; m++) {
    let g = S.v * prixHt * (TV[0] ?? 0), direct = g;
    for (let i = 0; i < 3; i++) g += cum[i] * (S.a / 100) * S.p * prixHt * (TV[i + 1] ?? 0) + neu[i] * (S.k / 100) * packHt(S.pk) * (TP[i] ?? 0);
    cum = cum.map((c, i) => c + neu[i]);
    out.push({ g, direct, equipe: cum.reduce((a, b) => a + b, 0) });
  }
  return out;
}
function renderSim() {
  const pl = n => n > 1 ? 's' : '';
  $('o-v').textContent = `${S.v} pot${pl(S.v)}`; $('o-n1').textContent = `${S.n1} personne${pl(S.n1)}`; $('o-p').textContent = `${S.p} pot${pl(S.p)}`;
  $('o-n2').textContent = S.n2; $('o-n3').textContent = S.n3; $('o-a').textContent = `${S.a} %`; $('o-k').textContent = `${S.k} %`;
  document.querySelectorAll('#s-pk button').forEach(b => b.classList.toggle('on', +b.dataset.v === S.pk));
  const r = simuler(), an = r.reduce((a, m) => a + m.g, 0), seul = r.reduce((a, m) => a + m.direct, 0);
  $('r-m').textContent = eur0(r[11].g);
  $('r-y').textContent = eur0(an);
  $('r-f').textContent = `${r[11].equipe} pers.`;
  barres($('r-chart'), r.map(m => m.g), r.map((_, i) => 'M' + (i + 1)), r.map((_, i) => 'Mois ' + (i + 1)), 11);
  const gainFilleul = S.p * prixHt * (TV[1] ?? 0);
  $('r-lev').innerHTML = seul > 0 && an > seul
    ? `Seul, vos ventes rapporteraient <b>${eur0(seul)}</b> sur l'année. Avec votre équipe : <b>${eur0(an)}</b>, soit <b>×${(an / seul).toLocaleString('fr-FR', { maximumFractionDigits: 1 })}</b>. Chaque filleul actif qui vend ${S.p} pots par mois vous rapporte <b>${eur(gainFilleul)}</b> par mois.`
    : an > 0 ? `Votre équipe seule rapporterait <b>${eur0(an)}</b> sur l'année.` : 'Bougez les curseurs pour voir ce que vous pourriez gagner.';
  $('r-hyp').textContent = `Calcul sur un prix moyen de ${eur(prixTtc)} TTC par pot, avec les taux de commission en vigueur.`;
}
[['s-v', 'v'], ['s-n1', 'n1'], ['s-p', 'p'], ['s-n2', 'n2'], ['s-n3', 'n3'], ['s-a', 'a'], ['s-k', 'k']].forEach(([id, k]) => {
  const el = $(id); el.value = S[k]; el.addEventListener('input', () => { S[k] = +el.value; renderSim(); });
});
$('s-pk').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.pk = +b.dataset.v; renderSim(); } });
renderSim();
</script>
</body>
</html>

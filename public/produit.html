<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  :root { --acc: var(--gold); --acc-bg: var(--gold); --acc-txt: #241a05; }
  main { padding: 28px 0 100px; overflow-x: clip; }
  .crumb { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-bottom: 26px; }
  .crumb a:hover { color: var(--text-hi); }

  /* --- Bloc d'achat --- */
  .pdp { display: grid; grid-template-columns: 1.08fr 1fr; gap: 64px; align-items: start; }
  .gallery { position: sticky; top: 88px; }
  .frame { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    background: #fefefe; }
  .frame img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; padding: 11% 6% 3%; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .frame:hover img { transform: scale(1.035); }
  .frame .num { position: absolute; top: 16px; left: 16px; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .08em;
    padding: 7px 12px; border-radius: 3px; background: rgba(14,14,13,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--acc); border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { font-family: var(--mono); font-size: 11px; color: var(--text-lo); border: 1px solid var(--line-2); border-radius: 30px; padding: 7px 12px; }
  .chip::before { content: "✓ "; color: var(--acc); }

  .buy .kicker { color: var(--acc); font-weight: 700; margin-bottom: 12px; }
  .buy h1 { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 14px; }
  .buy .pitch { font-size: 17px; line-height: 1.6; color: var(--text-lo); margin-bottom: 26px; max-width: 520px; }
  .price-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .price-row .price { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .price-row small { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  .key { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 20px 22px; border-radius: 10px; margin-bottom: 26px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--acc) 14%, transparent), transparent 60%), var(--ink-2); border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent); }
  .key .v { font-family: var(--mono); font-size: 34px; font-weight: 700; color: var(--acc); line-height: 1; white-space: nowrap; }
  .key .u { font-family: var(--mono); font-size: 11px; color: var(--text-lo); margin-top: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .key ul { list-style: none; display: grid; gap: 8px; font-size: 14px; }
  .key li::before { content: "✓"; color: var(--acc); font-weight: 700; margin-right: 10px; }

  .order { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; background: var(--ink-2); }
  .qty button { width: 46px; height: 56px; background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 18px; color: var(--text-hi); }
  .qty button:hover { color: var(--acc); }
  .qty button:disabled { opacity: .3; cursor: default; }
  .qty output { min-width: 32px; text-align: center; font-family: var(--mono); font-size: 16px; font-weight: 700; }
  .add { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 58px; padding: 0 22px;
    border: none; border-radius: 10px; cursor: pointer; background: var(--acc-bg); color: var(--acc-txt);
    font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .03em;
    box-shadow: 0 14px 34px -14px color-mix(in srgb, var(--acc-bg) 80%, transparent); transition: transform .15s, box-shadow .2s, filter .2s; }
  .add:hover { transform: translateY(-2px); filter: brightness(1.07); box-shadow: 0 20px 40px -14px color-mix(in srgb, var(--acc-bg) 90%, transparent); }
  .add:active { transform: translateY(0); }
  .add::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.25) 50%, transparent 65%); transform: translateX(-100%); }
  .add:hover::after { transform: translateX(100%); transition: transform .8s; }
  .add .tot { font-size: 15px; }
  .add.done { filter: brightness(1.1); }
  .assure { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .assure span::before { content: "● "; color: var(--acc); font-size: 8px; vertical-align: 2px; }

  details { border-top: 1px solid var(--line); }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  details:first-of-type { margin-top: 34px; }
  summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 18px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 18px; color: var(--text-lo); transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); color: var(--acc); }
  details .in { padding: 0 0 20px; font-size: 14px; line-height: 1.7; color: var(--text-lo); }
  .compo { width: 100%; border-collapse: collapse; }
  .compo td { padding: 10px 0; border-bottom: 1px solid var(--line); white-space: normal; background: none; }
  .compo tr:last-child td { border-bottom: none; }
  .compo td:first-child { color: var(--text-hi); font-weight: 500; width: 42%; }

  /* --- Sections --- */
  .sec { margin-top: 110px; }
  .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
  .sec-head h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.015em; max-width: 560px; }
  .sec-head h2 em { font-style: normal; color: var(--acc); }
  .sec-head p { color: var(--text-lo); font-size: 14px; max-width: 380px; }
  .ingr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .ing { position: relative; padding: 26px 22px 24px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); transition: border-color .2s, transform .2s; }
  .ing:hover { border-color: color-mix(in srgb, var(--acc) 45%, transparent); transform: translateY(-3px); }
  .ing .n { font-family: var(--mono); font-size: 11px; color: var(--acc); margin-bottom: 26px; }
  .ing h3 { font-size: 19px; margin-bottom: 14px; }
  .ing .apporte { font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text-lo); }
  .ing .apporte::before { content: "Apporte "; display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }

  .promise { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; margin-top: 70px; }
  .promise > div { padding: 24px 22px; border-left: 1px solid var(--line); }
  .promise > div:first-child { border-left: none; }
  .promise b { display: block; font-size: 15px; margin-bottom: 6px; }
  .promise span { font-size: 13px; color: var(--text-lo); }

  .related { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .rel { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--ink-2); transition: border-color .2s; }
  .rel:hover { border-color: var(--line-2); }
  .rel img { width: 150px; height: 100%; min-height: 170px; object-fit: contain; object-position: center; background: #fff; padding: 10px; display: block; }
  .rel .b { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .rel .t { font-family: var(--mono); font-size: 11px; margin-bottom: 6px; }
  .rel h3 { font-size: 18px; }
  .rel p { font-size: 13px; color: var(--text-lo); margin-top: 6px; }
  .rel .f { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .rel .f b { font-family: var(--mono); font-size: 17px; }
  .legal { font-size: 11.5px; color: var(--text-dim); line-height: 1.6; margin-top: 60px; max-width: 820px; }

  /* --- Barre d'achat mobile --- */
  .sticky-buy { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: none; align-items: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(14,14,13,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    transform: translateY(110%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sticky-buy.show { transform: translateY(0); }
  .sticky-buy img { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; object-position: center; background: #fff; padding: 3px; }
  .sticky-buy .i { flex: 1; min-width: 0; }
  .sticky-buy .i b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sticky-buy .i span { font-family: var(--mono); font-size: 13px; color: var(--text-lo); }
  .sticky-buy .add { height: 46px; padding: 0 18px; font-size: 12px; }

  .notfound { text-align: center; padding: 100px 0; }

  @media (max-width: 960px) {
    .pdp { grid-template-columns: minmax(0, 1fr); gap: 30px; }
    .gallery { position: static; }
    .ingr { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .promise { grid-template-columns: 1fr 1fr; }
    .promise > div:nth-child(3) { border-left: none; }
    .promise > div:nth-child(n+3) { border-top: 1px solid var(--line); }
    .related { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 700px) {
    main { padding-top: 18px; padding-bottom: 110px; }
    .crumb { margin-bottom: 16px; }
    .buy h1 { font-size: 34px; }
    .buy .pitch { font-size: 15px; margin-bottom: 20px; }
    .price-row .price { font-size: 30px; }
    .key { grid-template-columns: 1fr; gap: 14px; }
    .add { padding: 0 16px; font-size: 13px; }
    .sec { margin-top: 76px; }
    .sec-head h2 { font-size: 25px; }
    .ingr { gap: 10px; }
    .ing { padding: 18px 16px; }
    .ing .n { margin-bottom: 16px; }
    .ing h3 { font-size: 16px; }
    .promise > div { padding: 18px 16px; }
    .rel { grid-template-columns: 110px minmax(0, 1fr); }
    .rel .b { padding: 16px 14px; }
    .rel img { width: 110px; min-height: 150px; }
    .rel p { display: none; }
    .sticky-buy { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="site-header"></header>
<main><div class="wrap" id="app"></div></main>
<footer class="site-footer"></footer>

<script type="module">
import { api, eur, eur0, esc, header, footer } from '/assets/app.js';
import { panierLateral } from '/assets/panier-lateral.js';
import { CATALOGUE } from '/assets/catalogue.js';
header('boutique'); footer();
const id = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] ?? '');
const cfg = await api('/api/config');
const prods = new Map(cfg.PRODUITS.map(x => [x.id, x]));
const p = prods.get(id), c = CATALOGUE[id];
const app = document.getElementById('app');

if (!p || !c) {
  app.innerHTML = `<div class="notfound"><h1>Produit introuvable</h1><p class="lead" style="margin:12px auto 26px">Ce produit n'existe pas ou n'est plus disponible.</p><a class="btn coral" href="/#produits">VOIR LA GAMME →</a></div>`;
} else {
  document.title = `${p.nom} — Biocez`;
  const root = document.documentElement.style;
  root.setProperty('--acc', c.accent); root.setProperty('--acc-bg', p.couleur); root.setProperty('--acc-txt', c.texteBouton);
  let qte = 1;
  const autres = cfg.PRODUITS.filter(x => x.id !== id && CATALOGUE[x.id]);

  app.innerHTML = `
    <nav class="crumb" aria-label="Fil d'Ariane"><a href="/">Accueil</a> / <a href="/#produits">Boutique</a> / ${esc(p.nom)}</nav>
    <div class="pdp">
      <div class="gallery">
        <div class="frame"><span class="num">${esc(c.numero)} · ${esc(c.badge)}</span><img src="${c.image}" alt="Pot Biocez ${esc(p.nom)}" fetchpriority="high"></div>
        <div class="chips"><span class="chip">100 % naturel</span><span class="chip">Sans additifs</span><span class="chip">Pot de 250 g</span></div>
      </div>
      <div class="buy">
        <div class="kicker mono">${esc(c.numero)} · FORMULE EXCLUSIVE BIOCEZ</div>
        <h1>${esc(p.nom)}</h1>
        <p class="pitch">${esc(c.accroche)}</p>
        <div class="price-row"><span class="price">${eur(p.prix_ttc_cents)}</span><small>LE POT DE 250 G · TVA INCLUSE</small></div>
        <div class="key">
          <div><div class="v">${esc(c.chiffre.valeur)}</div><div class="u">${esc(c.chiffre.unite)}</div></div>
          <ul>${c.bienfaits.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
        </div>
        <div class="order" id="order">
          <div class="qty" role="group" aria-label="Quantité"><button type="button" id="moins" aria-label="Retirer un pot">−</button><output id="q" aria-live="polite">1</output><button type="button" id="plus" aria-label="Ajouter un pot">+</button></div>
          <button class="add" id="add"><span>AJOUTER AU PANIER</span><span class="tot" id="st">${eur(p.prix_ttc_cents)}</span></button>
        </div>
        <div class="assure"><span>Livraison offerte dès ${eur0(Math.round(cfg.LIVRAISON_OFFERTE_DES * 100))}</span><span>Paiement sécurisé</span><span>Rétractation ${cfg.RETRACTATION_JOURS} jours</span></div>
        <details open><summary>Description</summary><div class="in">${esc(c.description)}</div></details>
        <details><summary>Composition</summary><div class="in"><table class="compo"><tbody>${c.composition.map(([i, a]) => `<tr><td>${esc(i)}</td><td>${esc(a)}</td></tr>`).join('')}</tbody></table></div></details>
      </div>
    </div>

    <section class="sec">
      <div class="sec-head"><h2>Des ingrédients bruts, <em>rien de plus.</em></h2><p>Chaque ingrédient est choisi pour ce qu'il apporte. Pas d'additifs, pas de conservateurs.</p></div>
      <div class="ingr">${c.composition.map(([i, a], n) => `<div class="ing"><div class="n">0${n + 1}</div><h3>${esc(i)}</h3>
        <p class="apporte">${esc(a)}</p></div>`).join('')}</div>
      <div class="promise">
        <div><b>100 % naturel</b><span>Uniquement des ingrédients d'origine naturelle.</span></div>
        <div><b>Sans additifs</b><span>Aucun additif, aucun conservateur.</span></div>
        <div><b>Paiement sécurisé</b><span>Carte bancaire, via Stripe.</span></div>
        <div><b>14 jours</b><span>Pour changer d'avis après réception.</span></div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Complétez votre routine</h2><p>Les trois formules Biocez se complètent.</p></div>
      <div class="related">${autres.map(x => { const k = CATALOGUE[x.id]; return `<article class="rel">
        <a href="/produit/${x.id}"><img src="${k.image}" alt="${esc(x.nom)}" loading="lazy"></a>
        <div class="b"><div><div class="t" style="color:${k.accent}">${esc(k.numero)} · ${esc(k.badge)}</div><h3><a href="/produit/${x.id}">${esc(x.nom)}</a></h3><p>${esc(k.chiffre.valeur)} ${esc(k.chiffre.unite)}</p></div>
        <div class="f"><b>${eur(x.prix_ttc_cents)}</b><button class="btn sm" style="background:${x.couleur};border-color:${x.couleur};color:${k.texteBouton}" data-add="${x.id}">AJOUTER +</button></div></div>
      </article>`; }).join('')}</div>
    </section>
    <p class="legal">${esc(c.mention)}</p>`;

  // Barre d'achat mobile
  const bar = document.createElement('div');
  bar.className = 'sticky-buy';
  bar.innerHTML = `<img src="${c.image}" alt=""><div class="i"><b>${esc(p.nom)}</b><span>${eur(p.prix_ttc_cents)}</span></div><button class="add" data-add="${id}">AJOUTER</button>`;
  document.body.append(bar);
  new IntersectionObserver(([e]) => bar.classList.toggle('show', !e.isIntersecting && e.boundingClientRect.top < 0))
    .observe(document.getElementById('order'));

  const maj = () => {
    document.getElementById('q').textContent = qte;
    document.getElementById('st').textContent = eur(qte * p.prix_ttc_cents);
    document.getElementById('moins').disabled = qte <= 1;
  };
  document.getElementById('plus').onclick = () => { if (qte < 20) { qte++; maj(); } };
  document.getElementById('moins').onclick = () => { if (qte > 1) { qte--; maj(); } };
  maj();

  const panier = panierLateral(cfg.PRODUITS, cfg);
  document.getElementById('add').onclick = () => {
    panier.ajouter(id, qte);
    const b = document.getElementById('add'); b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 600);
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) panier.ajouter(b.dataset.add, 1); });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Merci — Biocez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  main { padding: 64px 0 100px; }
  .box { max-width: 560px; margin: 0 auto; }
  .head { text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 700; }
  .mark.ok { background: var(--gold); color: #241a05; }
  .mark.wait { border: 3px solid var(--line-2); border-top-color: var(--gold); animation: tourne 1s linear infinite; }
  .mark.ko { border: 2px solid var(--line-2); color: var(--text-lo); }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark.wait { animation: none; } }
  .head .lead { margin: 12px auto 0; }
  .recap { margin-top: 30px; }
  .recap h2 { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin: 0 0 12px; }
  .ligne { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ligne img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; }
  .ligne .n { flex: 1; min-width: 0; }
  .ligne .q { font-family: var(--mono); color: var(--text-lo); white-space: nowrap; }
  .total { display: flex; justify-content: space-between; padding-top: 14px; font-size: 15px; }
  .total b { font-family: var(--mono); font-size: 20px; color: var(--gold); }
  .adr { margin-top: 22px; font-size: 14px; color: var(--text-lo); line-height: 1.6; }
  .adr b { color: var(--text-hi); font-weight: 600; }
  .acts { margin-top: 26px; text-align: center; }
  .invite { margin-top: 26px; padding: 22px; border: 1px solid rgba(212,175,90,.45); border-radius: var(--radius); background: var(--gold-soft); }
  .invite h3 { margin: 0 0 6px; }
  .invite p { margin: 0 0 16px; font-size: 14px; color: var(--text-lo); }
</style>
</head>
<body>
<header class="site-header"></header>
<main><div class="wrap box">
  <div class="head">
    <div class="mark ok" id="mark" aria-hidden="true">✓</div>
    <div class="eyebrow" id="eyebrow">Commande reçue</div>
    <h1 id="titre">Merci pour votre commande</h1>
    <p class="lead" id="msg" aria-live="polite">Vous allez recevoir un e-mail de confirmation.</p>
  </div>
  <div class="card recap" id="recap" hidden></div>
  <div class="invite" id="invite" hidden>
    <h3>Vous aimez nos produits ?</h3>
    <p id="invite-t"></p>
    <a class="btn gold block" href="/revendeur">DEVENIR REVENDEUR →</a>
  </div>
  <div class="acts"><a class="btn" id="next" href="/">RETOUR À LA BOUTIQUE →</a></div>
</div></main>
<footer class="site-footer"></footer>
<script type="module">
import { api, eur, pct, esc, header, footer, setCart } from '/assets/app.js';
import { CATALOGUE } from '/assets/catalogue.js';
header(); footer();
const $ = id => document.getElementById(id);
const ref = new URLSearchParams(location.search).get('ref');
// La référence ne reste ni dans l'historique ni dans les liens partagés par erreur.
history.replaceState(null, '', '/merci');
const cfg = await api('/api/config').catch(() => null);

function etat(mark, symbole, eyebrow, titre, msg) {
  $('mark').className = 'mark ' + mark; $('mark').textContent = symbole;
  $('eyebrow').textContent = eyebrow; $('titre').textContent = titre; $('msg').textContent = msg;
}

function afficher(o) {
  const paye = o.statut === 'payee' || o.statut === 'livree';
  if (paye) {
    if (o.type === 'vente_client') setCart({});
    etat('ok', '✓', 'Commande confirmée', 'Merci pour votre commande', o.type === 'pack'
      ? `Votre pack ${o.pack_taille} est en préparation. Vous avez maintenant accès au tarif revendeur.`
      : `Commande n° ${o.id} payée. Un e-mail de confirmation vient de vous être envoyé.`);
  } else if (o.statut === 'en_attente_paiement') {
    etat('wait', '', 'Paiement en cours', 'Paiement en cours de confirmation…', 'Cela prend quelques secondes. Ne fermez pas cette page.');
  } else {
    etat('ko', '!', 'Commande non aboutie', 'Le paiement n\'a pas abouti', 'Aucun montant n\'a été prélevé. Votre panier est toujours disponible.');
    $('next').href = '/panier'; $('next').textContent = 'REVENIR AU PANIER →';
  }
  $('recap').hidden = !paye;
  if (paye) {
    const l = o.livraison ?? {};
    $('recap').innerHTML = `<h2>Récapitulatif · n° ${o.id}</h2>
      ${o.articles.map(a => `<div class="ligne"><img src="${esc(CATALOGUE[a.produit_id]?.image ?? '')}" alt=""><span class="n">${esc(a.nom)}</span><span class="q">× ${a.quantite}</span></div>`).join('')}
      <div class="total"><span>Total TTC${o.type === 'pack' ? ` · pack ${o.pack_taille}` : ''}</span><b>${eur(o.montant_ttc_cents)}</b></div>
      ${l.adresse ? `<div class="adr">Livraison à<br><b>${esc(l.nom ?? '')}</b><br>${esc(l.adresse)}<br>${esc(l.code_postal)} ${esc(l.ville)}</div>` : ''}`;
  }
  if (o.type === 'pack') { $('next').href = '/espace'; $('next').textContent = 'MON ESPACE →'; $('next').className = 'btn gold'; }
  // Proposer de devenir revendeur au client qui vient d'acheter.
  const taux = cfg?.TAUX_VENTE_CLIENT?.[0];
  $('invite').hidden = !(paye && o.type === 'vente_client' && taux);
  if (taux) $('invite-t').textContent = `Recommandez-les autour de vous et gagnez ${pct(taux)} sur chaque vente passée par votre lien. Inscription gratuite, sans stock ni engagement.`;
  return paye || o.statut !== 'en_attente_paiement';
}

if (ref) {
  let essais = 0;
  const suivre = async () => {
    const o = await api('/api/commandes/' + encodeURIComponent(ref)).catch(() => null);
    if (!o) return etat('ko', '?', 'Commande', 'Commande introuvable', 'Ce lien n\'est plus valide. Si vous avez payé, l\'e-mail de confirmation fait foi.');
    if (afficher(o)) return;
    // Paiement pas encore confirmé par Stripe : on revérifie pendant 1 minute environ.
    if (++essais < 30) return setTimeout(suivre, 2000);
    etat('wait', '', 'Paiement en cours', 'Confirmation plus longue que prévu', 'Vous recevrez un e-mail dès que le paiement sera confirmé. Vous pouvez fermer cette page.');
    $('mark').className = 'mark ko'; $('mark').textContent = '…';
  };
  await suivre();
}
</script>
</body>
</html>
